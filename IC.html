    const state = {
      query: '',
      scope: 'all',
      rankGroup: 'all',
      titleCat: 'all',
      code: 'all',
      selectedTag: null,
      onlyFav: false,
      sort: 'default',
      view: 'grid',
      tagsOpen: false,
      favIds: new Set(),
      compareIds: []
    };

    try {
      const savedFavs = JSON.parse(localStorage.getItem('uestc_ic_favs') || '[]');
      if (Array.isArray(savedFavs)) state.favIds = new Set(savedFavs);
    } catch (e) {}

    function saveFavs() {
      try {
        localStorage.setItem('uestc_ic_favs', JSON.stringify(Array.from(state.favIds)));
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function highlightText(text, terms) {
      let safe = escapeHtml(text);
      if (!terms.length) return safe;
      const escapedTerms = terms
        .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
        .filter(Boolean);
      if (!escapedTerms.length) return safe;
      const re = new RegExp('(' + escapedTerms.join('|') + ')', 'gi');
      return safe.replace(re, '<mark class="hl">$1</mark>');
    }

    function getSearchTarget(t, scope) {
      if (scope === 'name') return t.name;
      if (scope === 'research') return t.research.join('\n');
      if (scope === 'courses') return t.courses.join('\n');
      if (scope === 'admission') return t.admission.join('\n');
      if (scope === 'background') return t.background.join('\n');
      return [t.name, t.title, t.rankGroup, ...t.rawLines].join('\n');
    }

    function getFilteredTeachers() {
      const terms = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
      let list = TEACHERS.filter(t => {
        if (state.rankGroup !== 'all' && t.rankGroup !== state.rankGroup) return false;
        if (state.titleCat !== 'all' && t.titleCategory !== state.titleCat) return false;
        if (state.code !== 'all' && !t.codes.includes(state.code)) return false;
        if (state.selectedTag && !t.tags.includes(state.selectedTag)) return false;
        if (state.onlyFav && !state.favIds.has(t.id)) return false;
        if (terms.length) {
          const target = getSearchTarget(t, state.scope).toLowerCase();
          if (!terms.every(term => target.includes(term))) return false;
        }
        return true;
      });

      if (state.sort === 'pinyin') {
        list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
      }
      return { list, terms };
    }

    function renderDomainTags() {
      const counts = {};
      TEACHERS.forEach(t => t.tags.forEach(tag => { counts[tag] = (counts[tag] || 0) + 1; }));
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const container = document.getElementById('domainTagsContainer');
      container.innerHTML = sorted.map(([tag, count]) => {
        const active = state.selectedTag === tag;
        return `<button type="button" data-tag="${escapeHtml(tag)}" class="domain-tag px-2.5 py-1 rounded-full text-xs font-medium border transition ${
          active
            ? 'bg-blue-600 text-white border-blue-600 shadow-xs'
            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-blue-50 hover:border-blue-300'
        }">${escapeHtml(tag)} <span class="${active ? 'text-blue-100' : 'text-slate-400'}">(${count})</span></button>`;
      }).join('');
    }

    function renderActiveChips() {
      const chips = [];
      if (state.query.trim()) chips.push({ label: `关键词: ${state.query.trim()}`, clear: () => { state.query = ''; document.getElementById('searchInput').value = ''; } });
      if (state.rankGroup !== 'all') chips.push({ label: state.rankGroup, clear: () => { state.rankGroup = 'all'; updateRankPills(); } });
      if (state.titleCat !== 'all') chips.push({ label: `职称: ${state.titleCat}`, clear: () => { state.titleCat = 'all'; document.getElementById('titleSelect').value = 'all'; } });
      if (state.code !== 'all') chips.push({ label: `专业代码: ${state.code}`, clear: () => { state.code = 'all'; document.getElementById('codeSelect').value = 'all'; } });
      if (state.selectedTag) chips.push({ label: `领域: ${state.selectedTag}`, clear: () => { state.selectedTag = null; renderDomainTags(); } });
      if (state.onlyFav) chips.push({ label: '仅看收藏', clear: () => { state.onlyFav = false; updateFavBtn(); } });

      const container = document.getElementById('activeFiltersChips');
      container.innerHTML = chips.map((c, idx) => `
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 text-xs">
          ${escapeHtml(c.label)}
          <button type="button" data-chip-idx="${idx}" class="hover:text-blue-950 font-bold leading-none">&times;</button>
        </span>
      `).join('');
      container.querySelectorAll('button[data-chip-idx]').forEach(btn => {
        btn.addEventListener('click', () => {
          chips[Number(btn.dataset.chipIdx)].clear();
          render();
        });
      });

      document.getElementById('btnResetAll').classList.toggle('hidden', chips.length === 0);
    }

    function updateRankPills() {
      document.querySelectorAll('.rank-pill').forEach(btn => {
        const active = btn.dataset.rank === state.rankGroup;
        btn.className = `rank-pill px-2.5 py-1 rounded-lg font-medium transition ${
          active ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
        }`;
      });
    }

    function updateFavBtn() {
      const btn = document.getElementById('btnFavFilter');
      document.getElementById('favCountBadge').textContent = state.favIds.size;
      if (state.onlyFav) {
        btn.classList.add('ring-2', 'ring-amber-300', 'bg-white/25');
      } else {
        btn.classList.remove('ring-2', 'ring-amber-300', 'bg-white/25');
      }
    }

    function updateCompareBadge() {
      document.getElementById('compareCountBadge').textContent = state.compareIds.length;
    }

    function cleanSectionText(lines, prefixRegex) {
      if (!lines.length) return '';
      return lines.map((l, i) => i === 0 ? l.replace(prefixRegex, '') : l).filter(Boolean).join('；');
    }

    function render() {
      const { list, terms } = getFilteredTeachers();
      document.getElementById('resultCount').textContent = list.length;
      document.getElementById('btnClearSearch').classList.toggle('hidden', !state.query.trim());
      updateFavBtn();
      updateCompareBadge();
      renderActiveChips();

      const container = document.getElementById('resultsContainer');
      const emptyState = document.getElementById('emptyState');

      if (!list.length) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      if (state.view === 'grid') {
        container.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
      } else {
        container.className = 'flex flex-col gap-3';
      }

      container.innerHTML = list.map(t => {
        const isFav = state.favIds.has(t.id);
        const isCmp = state.compareIds.includes(t.id);
        const researchText = cleanSectionText(t.research, /^(研究方向|科研方向|主要研究方向|研究领域)[：:]?/) || '详见完整资料';
        const coursesText = cleanSectionText(t.courses, /^主讲课程[：:]?/);
        const admissionText = cleanSectionText(t.admission, /^招生方向[：:]?/);
        const bgText = t.background.join('；');

        const tagsHtml = t.tags.slice(0, 3).map(tag =>
          `<span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[11px] font-medium">${escapeHtml(tag)}</span>`
        ).join('') + (t.tags.length > 3 ? `<span class="px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-500 text-[11px]">+${t.tags.length - 3}</span>` : '');

        if (state.view === 'list') {
          return `
            <article data-id="${t.id}" class="teacher-card bg-white rounded-xl border border-slate-200 hover:border-blue-400 hover:shadow-md transition p-4 cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="flex-1 min-w-0 space-y-1.5">
                <div class="flex flex-wrap items-center gap-2">
                  <h3 class="text-base font-bold text-slate-900">${highlightText(t.name, terms)}</h3>
                  <span class="px-2 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200">${highlightText(t.title, terms)}</span>
                  <span class="text-xs text-slate-400">${escapeHtml(t.rankGroup)}</span>
                  <div class="flex flex-wrap gap-1">${tagsHtml}</div>
                </div>
                <p class="text-xs sm:text-sm text-slate-600 line-clamp-2"><span class="font-medium text-slate-800">研究方向：</span>${highlightText(researchText, terms)}</p>
                ${coursesText ? `<p class="text-xs text-slate-500 line-clamp-1"><span class="font-medium text-slate-700">主讲课程：</span>${highlightText(coursesText, terms)}</p>` : ''}
                ${admissionText ? `<p class="text-xs text-slate-500 line-clamp-1"><span class="font-medium text-slate-700">招生方向：</span>${highlightText(admissionText, terms)}</p>` : ''}
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button type="button" data-action="fav" data-id="${t.id}" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium transition ${isFav ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">
                  ${isFav ? '★ 已收藏' : '☆ 收藏'}
                </button>
                <button type="button" data-action="cmp" data-id="${t.id}" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium transition ${isCmp ? 'bg-blue-50 border-blue-300 text-blue-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">
                  ${isCmp ? '✓ 已选对比' : '+ 对比'}
                </button>
              </div>
            </article>
          `;
        }

        return `
          <article data-id="${t.id}" class="teacher-card bg-white rounded-2xl border border-slate-200 hover:border-blue-400 hover:shadow-lg transition p-4 flex flex-col justify-between cursor-pointer group">
            <div class="space-y-2.5">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <div class="flex flex-wrap items-center gap-1.5">
                    <h3 class="text-base font-bold text-slate-900 group-hover:text-blue-700 transition">${highlightText(t.name, terms)}</h3>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-blue-50 text-blue-700 border border-blue-200">${highlightText(t.title, terms)}</span>
                  </div>
                  <p class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(t.rankGroup)}</p>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button" data-action="fav" data-id="${t.id}" title="收藏导师" class="p-1.5 rounded-lg border transition ${isFav ? 'bg-amber-50 border-amber-300 text-amber-500' : 'bg-white border-slate-200 text-slate-400 hover:text-amber-500 hover:bg-amber-50/50'}">
                    <i data-lucide="star" class="w-3.5 h-3.5 ${isFav ? 'fill-amber-400' : ''}"></i>
                  </button>
                  <button type="button" data-action="cmp" data-id="${t.id}" title="加入对比" class="px-2 py-1 rounded-lg border text-[11px] font-medium transition ${isCmp ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-200 text-slate-600 hover:border-blue-300 hover:text-blue-600'}">
                    ${isCmp ? '已选' : '对比'}
                  </button>
                </div>
              </div>

              ${tagsHtml ? `<div class="flex flex-wrap gap-1">${tagsHtml}</div>` : ''}

              <div class="space-y-1.5 text-xs text-slate-600 pt-1 border-t border-slate-100">
                <p class="line-clamp-3 leading-relaxed"><span class="font-semibold text-slate-800">研究方向：</span>${highlightText(researchText, terms)}</p>
                ${coursesText ? `<p class="line-clamp-2 leading-relaxed"><span class="font-semibold text-slate-800">主讲课程：</span>${highlightText(coursesText, terms)}</p>` : ''}
                ${admissionText ? `<p class="line-clamp-2 leading-relaxed"><span class="font-semibold text-slate-800">招生方向：</span>${highlightText(admissionText, terms)}</p>` : ''}
                ${bgText ? `<p class="line-clamp-1 text-slate-500"><span class="font-semibold text-slate-700">背景/去向：</span>${highlightText(bgText, terms)}</p>` : ''}
              </div>
            </div>

            <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs text-blue-600 font-medium">
              <span>查看完整资料</span>
              <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform"></i>
            </div>
          </article>
        `;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    function openDetailModal(id) {
      const t = TEACHERS.find(x => x.id === id);
      if (!t) return;
      const terms = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);

      document.getElementById('modalName').textContent = t.name;
      document.getElementById('modalTitle').textContent = t.title;
      document.getElementById('modalRankGroup').textContent = t.rankGroup;
      document.getElementById('modalTags').innerHTML = t.tags.map(tag =>
        `<span class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-700 border border-blue-200 text-xs font-medium">${escapeHtml(tag)}</span>`
      ).join('');

      const favBtn = document.getElementById('btnModalFav');
      const updateModalFav = () => {
        const isFav = state.favIds.has(t.id);
        favBtn.className = `p-2 rounded-lg border transition ${isFav ? 'bg-amber-50 border-amber-300 text-amber-500' : 'bg-white border-slate-200 text-slate-400 hover:text-amber-500'}`;
      };
      updateModalFav();
      favBtn.onclick = () => {
        toggleFav(t.id);
        updateModalFav();
      };

      document.getElementById('btnModalCopy').onclick = () => {
        const txt = `${t.name}：${t.title}\n${t.rawLines.join('\n')}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(() => showToast(`已复制 ${t.name} 的完整资料`)).catch(() => fallbackCopy(txt, t.name));
        } else {
          fallbackCopy(txt, t.name);
        }
      };

      const renderBlock = (title, icon, lines, emptyMsg) => {
        if (!lines.length) return '';
        return `
          <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-200/80">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2 flex items-center gap-1.5">
              <i data-lucide="${icon}" class="w-3.5 h-3.5 text-blue-600"></i>
              <span>${title}</span>
            </h4>
            <ul class="space-y-1 text-slate-800 leading-relaxed">
              ${lines.map(l => `<li>${highlightText(l, terms)}</li>`).join('')}
            </ul>
          </div>
        `;
      };

      document.getElementById('modalBody').innerHTML = `
        ${renderBlock('研究方向与科研内容', 'flask-conical', t.research)}
        ${renderBlock('主讲课程', 'book-open', t.courses)}
        ${renderBlock('招生方向与专业代码', 'graduation-cap', t.admission)}
        ${renderBlock('学历背景、指导竞赛与毕业去向', 'award', t.background)}
        <details class="bg-white rounded-xl border border-slate-200 p-3.5">
          <summary class="text-xs font-semibold text-slate-600 cursor-pointer select-none">查看文档原文全部记录（${t.rawLines.length} 行）</summary>
          <div class="mt-2.5 pt-2.5 border-t border-slate-100 space-y-1 text-xs text-slate-600 leading-relaxed">
            ${t.rawLines.map(l => `<p>${highlightText(l, terms)}</p>`).join('')}
          </div>
        </details>
      `;

      document.getElementById('detailModal').classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function fallbackCopy(text, name) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(`已复制 ${name} 的完整资料`);
      } catch (e) {
        showToast('复制失败，请手动选中文本复制');
      }
      document.body.removeChild(ta);
    }

    function toggleFav(id) {
      if (state.favIds.has(id)) {
        state.favIds.delete(id);
        showToast('已取消收藏');
      } else {
        state.favIds.add(id);
        showToast('已加入收藏');
      }
      saveFavs();
      render();
    }

    function toggleCompare(id) {
      const idx = state.compareIds.indexOf(id);
      if (idx >= 0) {
        state.compareIds.splice(idx, 1);
      } else {
        if (state.compareIds.length >= 4) {
          showToast('最多同时对比 4 位导师');
          return;
        }
        state.compareIds.push(id);
      }
      render();
    }

    function openCompareModal() {
      const body = document.getElementById('compareBody');
      if (!state.compareIds.length) {
        body.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">尚未选择任何导师进行对比。请在教师卡片右上角点击“对比”按钮添加（最多 4 位）。</div>`;
      } else {
        const selected = state.compareIds.map(id => TEACHERS.find(t => t.id === id)).filter(Boolean);
        const rows = [
          { label: '职称 / 职级', fn: t => `${t.title}（${t.rankGroup}）` },
          { label: '领域标签', fn: t => t.tags.join('、') || '—' },
          { label: '研究方向', fn: t => t.research.join('\n') || '—' },
          { label: '主讲课程', fn: t => t.courses.join('\n') || '—' },
          { label: '招生方向', fn: t => t.admission.join('\n') || '—' },
          { label: '背景与去向', fn: t => t.background.join('\n') || '—' }
        ];
        body.innerHTML = `
          <table class="w-full border-collapse text-xs sm:text-sm">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200">
                <th class="p-3 text-left font-semibold text-slate-600 w-28 align-top">对比维度</th>
                ${selected.map(t => `
                  <th class="p-3 text-left font-bold text-slate-900 min-w-[200px] align-top">
                    <div class="flex items-center justify-between gap-2">
                      <span>${escapeHtml(t.name)}</span>
                      <button type="button" data-rm-cmp="${t.id}" class="text-xs font-normal text-slate-400 hover:text-red-600">移除</button>
                    </div>
                  </th>
                `).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              ${rows.map(r => `
                <tr>
                  <td class="p-3 font-medium text-slate-600 bg-slate-50/50 align-top">${r.label}</td>
                  ${selected.map(t => `<td class="p-3 text-slate-700 align-top whitespace-pre-line leading-relaxed">${escapeHtml(r.fn(t))}</td>`).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        body.querySelectorAll('button[data-rm-cmp]').forEach(btn => {
          btn.addEventListener('click', () => {
            toggleCompare(Number(btn.dataset.rmCmp));
            openCompareModal();
          });
        });
      }
      document.getElementById('compareModal').classList.remove('hidden');
    }

    function resetAll() {
      state.query = '';
      state.scope = 'all';
      state.rankGroup = 'all';
      state.titleCat = 'all';
      state.code = 'all';
      state.selectedTag = null;
      state.onlyFav = false;
      document.getElementById('searchInput').value = '';
      document.getElementById('scopeSelect').value = 'all';
      document.getElementById('titleSelect').value = 'all';
      document.getElementById('codeSelect').value = 'all';
      updateRankPills();
      renderDomainTags();
      render();
    }

    // Event bindings
    document.getElementById('searchInput').addEventListener('input', e => {
      state.query = e.target.value;
      render();
    });
    document.getElementById('btnClearSearch').addEventListener('click', () => {
      state.query = '';
      document.getElementById('searchInput').value = '';
      render();
    });
    document.getElementById('scopeSelect').addEventListener('change', e => {
      state.scope = e.target.value;
      render();
    });
    document.getElementById('titleSelect').addEventListener('change', e => {
      state.titleCat = e.target.value;
      render();
    });
    document.getElementById('codeSelect').addEventListener('change', e => {
      state.code = e.target.value;
      render();
    });
    document.getElementById('sortSelect').addEventListener('change', e => {
      state.sort = e.target.value;
      render();
    });
    document.getElementById('rankPills').addEventListener('click', e => {
      const btn = e.target.closest('.rank-pill');
      if (!btn) return;
      state.rankGroup = btn.dataset.rank;
      updateRankPills();
      render();
    });
    document.getElementById('btnToggleTags').addEventListener('click', () => {
      state.tagsOpen = !state.tagsOpen;
      document.getElementById('domainTagsBar').classList.toggle('hidden', !state.tagsOpen);
      document.getElementById('tagsChevron').classList.toggle('rotate-180', state.tagsOpen);
    });
    document.getElementById('domainTagsContainer').addEventListener('click', e => {
      const btn = e.target.closest('.domain-tag');
      if (!btn) return;
      const tag = btn.dataset.tag;
      state.selectedTag = state.selectedTag === tag ? null : tag;
      renderDomainTags();
      render();
    });
    document.getElementById('btnViewGrid').addEventListener('click', () => {
      state.view = 'grid';
      document.getElementById('btnViewGrid').className = 'p-1 rounded-md bg-white text-blue-600 shadow-sm';
      document.getElementById('btnViewList').className = 'p-1 rounded-md text-slate-500 hover:text-slate-800';
      render();
    });
    document.getElementById('btnViewList').addEventListener('click', () => {
      state.view = 'list';
      document.getElementById('btnViewList').className = 'p-1 rounded-md bg-white text-blue-600 shadow-sm';
      document.getElementById('btnViewGrid').className = 'p-1 rounded-md text-slate-500 hover:text-slate-800';
      render();
    });
    document.getElementById('btnFavFilter').addEventListener('click', () => {
      state.onlyFav = !state.onlyFav;
      render();
    });
    document.getElementById('btnResetAll').addEventListener('click', resetAll);
    document.getElementById('btnEmptyReset').addEventListener('click', resetAll);

    // Card click delegation
    document.getElementById('resultsContainer').addEventListener('click', e => {
      const actionBtn = e.target.closest('button[data-action]');
      if (actionBtn) {
        e.stopPropagation();
        const id = Number(actionBtn.dataset.id);
        if (actionBtn.dataset.action === 'fav') toggleFav(id);
        if (actionBtn.dataset.action === 'cmp') toggleCompare(id);
        return;
      }
      const card = e.target.closest('.teacher-card');
      if (card) openDetailModal(Number(card.dataset.id));
    });

    // Modals
    document.getElementById('btnCloseDetail').addEventListener('click', () => document.getElementById('detailModal').classList.add('hidden'));
    document.getElementById('detailModal').addEventListener('click', e => {
      if (e.target.id === 'detailModal') document.getElementById('detailModal').classList.add('hidden');
    });
    document.getElementById('btnOpenCompare').addEventListener('click', openCompareModal);
    document.getElementById('btnCloseCompare').addEventListener('click', () => document.getElementById('compareModal').classList.add('hidden'));
    document.getElementById('compareModal').addEventListener('click', e => {
      if (e.target.id === 'compareModal') document.getElementById('compareModal').classList.add('hidden');
    });
    document.getElementById('btnClearCompare').addEventListener('click', () => {
      state.compareIds = [];
      render();
      openCompareModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.getElementById('detailModal').classList.add('hidden');
        document.getElementById('compareModal').classList.add('hidden');
      }
    });

    // Init
    renderDomainTags();
    render();
  </script>
</body>
</html>
