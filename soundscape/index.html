<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="潮汐声景：使用 Web Audio API 创建属于你的专注、睡眠与放松混音。">
<title>潮汐声景 · Tidal Soundscape</title>
<style>
:root{--bg:#08111f;--panel:#101d31;--panel2:#172944;--line:#29415f;--text:#eef6ff;--muted:#91a9c5;--cyan:#69d7dc;--violet:#ad9bff;--pink:#ff9bcf;--good:#72e0a4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% -10%,#244b63 0,#0b1728 37%,var(--bg) 72%);color:var(--text);font:14px/1.55 Inter,"Microsoft YaHei","PingFang SC",sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{width:min(1240px,calc(100% - 32px));margin:auto;padding:28px 0 42px}
.top{display:flex;align-items:end;justify-content:space-between;gap:22px;margin-bottom:22px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:3px;font-weight:800}.top h1{font-size:clamp(30px,5vw,56px);line-height:1;margin:10px 0 12px;letter-spacing:-.04em}.top p{color:var(--muted);max-width:660px;margin:0}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:end}.btn,.chip{border:1px solid var(--line);border-radius:10px;background:#102039;color:var(--text);padding:9px 13px}.btn:hover,.btn.active,.chip.active{border-color:var(--cyan);background:#173753}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#08202b;font-weight:800}
.hero{display:grid;grid-template-columns:1.55fr .85fr;gap:16px;margin-bottom:18px}.visual,.master{background:#0e1b2ddd;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px #0003}.visual{position:relative;min-height:205px;overflow:hidden}.visual canvas{display:block;width:100%;height:100%;min-height:205px}.visual-copy{position:absolute;inset:20px;pointer-events:none}.visual-copy strong{display:block;font-size:18px}.visual-copy span{display:inline-block;margin-top:8px;color:var(--muted)}.visual-tabs{position:absolute;right:15px;top:15px;z-index:2;display:flex;gap:5px}.visual-tab{border:1px solid #3a5974;background:#0b192acc;color:var(--muted);border-radius:7px;padding:5px 9px;font-size:11px}.visual-tab.active{background:#205064;color:#eaffff;border-color:var(--cyan)}.master{padding:21px}.master h2{margin:0 0 5px;font-size:18px}.master p{margin:0 0 20px;color:var(--muted);font-size:13px}.range{width:100%;accent-color:var(--cyan)}.master-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0}.master-value{color:var(--cyan);font-variant-numeric:tabular-nums}.timer{display:flex;gap:7px;align-items:center}.timer select{background:#0b1728;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar .search{margin-left:auto;min-width:190px;max-width:270px}.search{background:#0c192b;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px 12px;outline:0}.search:focus{border-color:var(--cyan)}.categories{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 11px;border-radius:999px;color:var(--muted);font-size:12px}
.preset-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.preset-row b{font-size:12px;color:var(--muted);font-weight:600}.preset{border:0;border-bottom:1px solid #42627e;background:transparent;color:#c5d9ef;padding:4px 1px}.preset:hover{color:var(--cyan);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sound{position:relative;background:linear-gradient(145deg,#13243b,#0d192a);border:1px solid var(--line);border-radius:15px;padding:15px;transition:.18s}.sound:hover{border-color:#4a7191;transform:translateY(-2px)}.sound.on{border-color:var(--cyan);box-shadow:0 0 0 1px #69d7dc33,0 12px 30px #0003}.sound.hidden{display:none}.sound-head{display:flex;align-items:start;gap:11px}.sound-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:11px;background:#1b3d58;color:var(--cyan);font-size:20px;flex:0 0 auto}.sound h3{margin:0;font-size:16px}.sound small{color:var(--muted)}.toggle{margin-left:auto;width:42px;height:24px;border:1px solid var(--line);border-radius:99px;background:#091322;padding:2px}.toggle i{display:block;width:18px;height:18px;background:#60738b;border-radius:50%;transition:.18s}.sound.on .toggle{background:#276274;border-color:var(--cyan)}.sound.on .toggle i{transform:translateX(17px);background:#eaffff}.sound-controls{margin-top:15px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.sound-controls label{font-size:11px;color:var(--muted)}.sound-controls output{color:var(--cyan);font-size:11px}.sound-controls input{grid-column:1/-1;width:100%;accent-color:var(--cyan)}.sound-tags{display:flex;gap:5px;margin-top:11px}.sound-tags span{font-size:10px;border:1px solid #2b4560;color:#9bb3cd;border-radius:5px;padding:2px 6px}
.empty{display:none;padding:38px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.empty.show{display:block}.footer{margin-top:24px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px}.back{color:var(--cyan);text-decoration:none}
@media(max-width:850px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:start;flex-direction:column}.top-actions{justify-content:start}}
@media(max-width:560px){.app{width:min(100% - 22px,500px);padding-top:20px}.grid{grid-template-columns:1fr}.toolbar .search{max-width:none;flex:1 1 100%;margin-left:0}.footer{display:block}.footer span{display:block;margin-top:7px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div><div class="eyebrow">ETHEREAL / SOUND LAB</div><h1>潮汐声景</h1><p>把雨、风、炉火、城市与合成器叠在一起。所有声音在浏览器本地生成，无需下载音频，也不会上传你的混音。</p></div>
  <div class="top-actions"><a class="btn" href="../">← 项目首页</a><button class="btn" id="stop">■ 停止全部</button><button class="btn primary" id="random">✦ 随机混音</button></div>
</header>
<section class="hero">
  <div class="visual"><canvas id="scope" aria-label="实时声音波形"></canvas><div class="visual-tabs" role="tablist" aria-label="可视化模式"><button class="visual-tab active" data-visual="wave" role="tab" aria-selected="true">波形</button><button class="visual-tab" data-visual="spectrum" role="tab" aria-selected="false">频谱</button></div><div class="visual-copy"><strong id="status">准备好开始一场声音旅行</strong><span id="status-detail">点选任意声源，建立你的专注空间</span></div></div>
  <aside class="master"><h2>总控台</h2><p>调节整套声景，并可设置自动停止时间。</p><div class="master-row"><span>总音量</span><strong class="master-value" id="master-value">60%</strong></div><input class="range" id="master" type="range" min="0" max="1" step=".01" value=".6"><div class="master-row"><span>自动停止</span><div class="timer"><select id="timer"><option value="0">不设置</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="60">60 分钟</option><option value="120">120 分钟</option></select><span id="countdown"></span></div></div><div class="master-row"><span>快捷键</span><span class="master-value">Space 播放 · R 随机</span></div></aside>
</section>
<div class="preset-row"><b>一键场景</b><button class="preset" data-preset="focus">深度专注</button><button class="preset" data-preset="rain">窗边雨夜</button><button class="preset" data-preset="sleep">柔和入眠</button><button class="preset" data-preset="cafe">咖啡馆</button><button class="preset" data-preset="ocean">海岸线</button><button class="preset" data-preset="clear">清空</button></div>
<div class="toolbar"><div class="categories" id="categories"><button class="chip active" data-category="all">全部 <span>18</span></button><button class="chip" data-category="nature">自然</button><button class="chip" data-category="place">空间</button><button class="chip" data-category="music">音乐</button><button class="chip" data-category="noise">噪声</button></div><input class="search" id="search" placeholder="搜索声源…" aria-label="搜索声源"></div>
<section class="grid" id="sounds"></section><div class="empty" id="empty">没有找到对应声源，换个关键词试试。</div>
<footer class="footer"><span>本页使用 Web Audio API 实时合成声音；首次播放需要你的点击授权。</span><span><a class="back" href="../">返回观澜项目首页</a> · 可离线使用</span></footer>
</main>
<script>
const defs=[
 {id:'rain',name:'细雨',icon:'☔',cat:'nature',desc:'均匀的雨幕',tags:'放松 睡眠',kind:'noise',color:'#69d7dc'},
 {id:'storm',name:'远方雷雨',icon:'⚡',cat:'nature',desc:'低沉雷声与雨',tags:'氛围 深夜',kind:'storm',color:'#9b9cfb'},
 {id:'ocean',name:'海浪',icon:'≋',cat:'nature',desc:'缓慢起伏的海岸',tags:'冥想 呼吸',kind:'ocean',color:'#6eafff'},
 {id:'stream',name:'溪流',icon:'⌁',cat:'nature',desc:'清亮流动的水声',tags:'自然 专注',kind:'stream',color:'#72e0a4'},
 {id:'wind',name:'山风',icon:'〰',cat:'nature',desc:'穿过树梢的风',tags:'户外 放松',kind:'wind',color:'#b8d7e8'},
 {id:'birds',name:'清晨鸟鸣',icon:'♬',cat:'nature',desc:'远处的随机鸟声',tags:'清晨 自然',kind:'birds',color:'#ffd37c'},
 {id:'fire',name:'篝火',icon:'♨',cat:'nature',desc:'木柴噼啪作响',tags:'温暖 睡眠',kind:'fire',color:'#ffad72'},
 {id:'cafe',name:'咖啡馆',icon:'☕',cat:'place',desc:'人声与杯盏背景',tags:'工作 社交',kind:'cafe',color:'#e4ae82'},
 {id:'train',name:'夜行列车',icon:'▰',cat:'place',desc:'规律的铁轨节奏',tags:'旅行 专注',kind:'train',color:'#c7a6ff'},
 {id:'library',name:'安静图书馆',icon:'▤',cat:'place',desc:'翻页与空间底噪',tags:'阅读 学习',kind:'library',color:'#a7c7ad'},
 {id:'city',name:'城市街道',icon:'⌂',cat:'place',desc:'远处交通与人群',tags:'城市 氛围',kind:'city',color:'#cfb7db'},
 {id:'fan',name:'旧风扇',icon:'◌',cat:'noise',desc:'稳定的机械循环',tags:'屏蔽 睡眠',kind:'fan',color:'#a0c5d8'},
 {id:'brown',name:'棕噪声',icon:'▰',cat:'noise',desc:'深沉厚实的底噪',tags:'专注 屏蔽',kind:'brown',color:'#d49b7c'},
 {id:'pink',name:'粉红噪声',icon:'≋',cat:'noise',desc:'平衡柔和的噪声',tags:'专注 放松',kind:'pink',color:'#ed9dc6'},
 {id:'white',name:'白噪声',icon:'▦',cat:'noise',desc:'明亮均匀的噪声',tags:'屏蔽 工作',kind:'white',color:'#d7e7ef'},
 {id:'drone',name:'深海氛围',icon:'◉',cat:'music',desc:'缓慢漂浮的合成器',tags:'冥想 夜晚',kind:'drone',color:'#9d8bff'},
 {id:'pulse',name:'柔和脉冲',icon:'◒',cat:'music',desc:'低速双耳律动感',tags:'专注 节奏',kind:'pulse',color:'#67d4c7'},
 {id:'chimes',name:'玻璃风铃',icon:'✧',cat:'music',desc:'随机闪烁的高音',tags:'创作 空灵',kind:'chimes',color:'#f5c5ff'}
];
const presets={focus:{brown:.32,rain:.18,drone:.2,pulse:.16},rain:{rain:.55,storm:.22,wind:.18},sleep:{brown:.3,ocean:.3,fire:.18,drone:.18},cafe:{cafe:.5,library:.22,rain:.12},ocean:{ocean:.58,wind:.2,chimes:.12},clear:{}};
const state={levels:Object.fromEntries(defs.map(d=>[d.id,0])),category:'all',query:'',master:.6,ctx:null,masterGain:null,analyser:null,nodes:new Map(),timer:null,endAt:0};
const $=s=>document.querySelector(s), sounds=$('#sounds');
function card(d){const el=document.createElement('article');el.className='sound';el.dataset.id=d.id;el.dataset.category=d.cat;el.dataset.search=(d.name+d.desc+d.tags).toLowerCase();el.innerHTML=`<div class="sound-head"><div class="sound-icon" style="color:${d.color}">${d.icon}</div><div><h3>${d.name}</h3><small>${d.desc}</small></div><button class="toggle" aria-label="切换 ${d.name}" aria-pressed="false"><i></i></button></div><div class="sound-controls"><label>音量 <output>0%</output></label><span></span><input type="range" min="0" max="1" step=".01" value="0" aria-label="${d.name}音量"></div><div class="sound-tags">${d.tags.split(' ').map(t=>`<span>${t}</span>`).join('')}</div>`;const range=el.querySelector('input'),toggle=el.querySelector('.toggle');range.addEventListener('input',()=>setLevel(d.id,+range.value));toggle.addEventListener('click',()=>setLevel(d.id,state.levels[d.id]>.01?0:.32));sounds.append(el)}
defs.forEach(card);
function setLevel(id,value){value=Math.max(0,Math.min(1,value));state.levels[id]=value;const el=document.querySelector(`[data-id="${id}"]`),range=el.querySelector('input'),out=el.querySelector('output');range.value=value;out.textContent=Math.round(value*100)+'%';const on=value>.005;el.classList.toggle('on',on);el.querySelector('.toggle').setAttribute('aria-pressed',String(on));if(state.ctx){if(on&&!state.nodes.has(id))startSound(defs.find(d=>d.id===id));const n=state.nodes.get(id);if(n)n.gain.gain.setTargetAtTime(value,state.ctx.currentTime,.08)}updateStatus()}
function ensureAudio(){if(state.ctx)return;state.ctx=new AudioContext();state.masterGain=state.ctx.createGain();state.analyser=state.ctx.createAnalyser();state.analyser.fftSize=256;state.masterGain.connect(state.analyser);state.analyser.connect(state.ctx.destination);state.masterGain.gain.value=state.master}
function noiseBuffer(type){const len=state.ctx.sampleRate*3,b=state.ctx.createBuffer(1,len,state.ctx.sampleRate),a=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;if(type==='brown'){last=(last+.02*w)/1.02;a[i]=last*3.5}else if(type==='pink'){a[i]=(w*.55+last*.45);last=a[i]}else a[i]=w}return b}
function sourceNoise(type){const s=state.ctx.createBufferSource();s.buffer=noiseBuffer(type);s.loop=true;return s}
function startSound(d){ensureAudio();let source,filter;const gain=state.ctx.createGain();gain.gain.value=0;gain.connect(state.masterGain);if(['rain','brown','pink','white','fan'].includes(d.kind)){source=sourceNoise(d.kind==='fan'?'brown':d.kind);filter=state.ctx.createBiquadFilter();filter.type=d.kind==='white'?'highpass':'lowpass';filter.frequency.value=d.kind==='white'?900: d.kind==='fan'?850: d.kind==='rain'?4200: d.kind==='pink'?2600:480;source.connect(filter).connect(gain);source.start()}else{source=state.ctx.createOscillator();const lfo=state.ctx.createOscillator(),lg=state.ctx.createGain();source.type=d.kind==='drone'?'sine':'triangle';source.frequency.value=d.kind==='pulse'?110:d.kind==='drone'?78:140;filter=state.ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=d.kind==='drone'?420:900;source.connect(filter).connect(gain);if(d.kind==='pulse'){lfo.frequency.value=.13;lg.gain.value=32;lfo.connect(lg).connect(source.frequency);lfo.start()}source.start();if(['ocean','stream','wind','storm','fire','cafe','train','library','city','birds','chimes'].includes(d.kind)){source.stop();gain.disconnect();state.nodes.set(d.id,{gain});startTexture(d,gain);return}}state.nodes.set(d.id,{gain,source});gain.gain.setValueAtTime(state.levels[d.id],state.ctx.currentTime)}
function startTexture(d,gain){const n=state.nodes.get(d.id);const tick=()=>{if(!state.nodes.has(d.id)||state.levels[d.id]===0)return;const now=state.ctx.currentTime,osc=state.ctx.createOscillator(),g=state.ctx.createGain();osc.type=d.kind==='fire'?'triangle':'sine';let base={ocean:80,stream:420,wind:180,storm:55,fire:70,cafe:220,train:96,library:340,city:130,birds:600,chimes:720}[d.kind]||180;osc.frequency.value=base*(.7+Math.random()*.6);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.07,now+.03);g.gain.exponentialRampToValueAtTime(.001,now+(d.kind==='storm'?1.5:.25+Math.random()*.7));osc.connect(g).connect(gain);osc.start(now);osc.stop(now+2);setTimeout(tick,(d.kind==='storm'?3500:300+Math.random()*1800))};tick()}
function updateStatus(){const active=defs.filter(d=>state.levels[d.id]>.005);$('#status').textContent=active.length?`${active.length} 个声源正在流动`:'准备好开始一场声音旅行';$('#status-detail').textContent=active.length?active.map(d=>d.name).slice(0,4).join(' · ')+(active.length>4?' …':''):'点选任意声源，建立你的专注空间'}
function playAll(){ensureAudio();if(state.ctx.state==='suspended')state.ctx.resume();defs.forEach(d=>{if(state.levels[d.id]>.005&&!state.nodes.has(d.id))startSound(d)});updateStatus()}
$('#master').addEventListener('input',e=>{state.master=+e.target.value;$('#master-value').textContent=Math.round(state.master*100)+'%';if(state.masterGain)state.masterGain.gain.setTargetAtTime(state.master,state.ctx.currentTime,.1)});
$('#stop').addEventListener('click',()=>{defs.forEach(d=>setLevel(d.id,0));state.nodes.clear();if(state.ctx)state.ctx.suspend();});
$('#random').addEventListener('click',()=>{const chosen=[...defs].sort(()=>Math.random()-.5).slice(0,3+Math.floor(Math.random()*4));defs.forEach(d=>setLevel(d.id,chosen.includes(d)?(.12+Math.random()*.35):0));playAll()});
document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{const p=presets[b.dataset.preset];defs.forEach(d=>setLevel(d.id,p[d.id]||0));if(b.dataset.preset!=='clear')playAll()}));
document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.category;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));filter()}));
$('#search').addEventListener('input',e=>{state.query=e.target.value.toLowerCase();filter()});
function filter(){let count=0;document.querySelectorAll('.sound').forEach(el=>{const show=(state.category==='all'||el.dataset.category===state.category)&&el.dataset.search.includes(state.query);el.classList.toggle('hidden',!show);if(show)count++});$('#empty').classList.toggle('show',!count)}
$('#timer').addEventListener('change',e=>{const min=+e.target.value;clearInterval(state.timer);state.endAt=min?Date.now()+min*60000:0;if(min)state.timer=setInterval(()=>{const left=Math.max(0,state.endAt-Date.now());$('#countdown').textContent=`${Math.ceil(left/60000)} 分钟`;if(!left){$('#timer').value='0';$('#stop').click();clearInterval(state.timer)}},1000);else $('#countdown').textContent=''});
const canvas=$('#scope'),ctx=canvas.getContext('2d');let visualMode='wave';const waveData=new Uint8Array(256),freqData=new Uint8Array(128);
document.querySelectorAll('.visual-tab').forEach(button=>button.addEventListener('click',()=>{visualMode=button.dataset.visual;document.querySelectorAll('.visual-tab').forEach(tab=>{const active=tab===button;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active))});canvas.setAttribute('aria-label',visualMode==='wave'?'实时声音波形':'实时声音频谱')}));
function drawGrid(w,h){ctx.fillStyle='#0a1728';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#28506a';ctx.globalAlpha=.5;for(let x=0;x<w;x+=w/12){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=h/5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.globalAlpha=1}
function draw(){const w=canvas.width=canvas.clientWidth*devicePixelRatio,h=canvas.height=canvas.clientHeight*devicePixelRatio;drawGrid(w,h);const analyser=state.analyser;if(visualMode==='wave'){if(analyser)analyser.getByteTimeDomainData(waveData);ctx.beginPath();for(let i=0;i<waveData.length;i++){const value=analyser?(waveData[i]-128)/128:Math.sin(i*.22+performance.now()/800)*.04,x=i/(waveData.length-1)*w,y=h/2+value*h*.38;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle='#69d7dc';ctx.lineWidth=2*devicePixelRatio;ctx.stroke()}else{if(analyser)analyser.getByteFrequencyData(freqData);const bars=64,gap=2*devicePixelRatio,bw=w/bars-gap;for(let i=0;i<bars;i++){const value=analyser?freqData[i]/255:.04+Math.abs(Math.sin(i*.35+performance.now()/700))*.025,x=i*w/bars,y=h-value*h*.82;const gradient=ctx.createLinearGradient(0,y,0,h);gradient.addColorStop(0,'#ad9bff');gradient.addColorStop(1,'#69d7dc');ctx.fillStyle=gradient;ctx.fillRect(x,y,Math.max(1,bw),value*h*.82)}}requestAnimationFrame(draw)}draw();
window.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.code==='Space'){e.preventDefault();const playing=defs.some(d=>state.levels[d.id]>.005);playing?$('#stop').click():$('#random').click()}if(e.key.toLowerCase()==='r')$('#random').click()});
filter();
</script>
</body>
</html>
