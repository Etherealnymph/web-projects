<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中英双语词典 · Bilingual Dictionary</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
  :root{
    --bg:#f6f3ec;
    --surface:#fffdf8;
    --surface2:#efe9dc;
    --ink:#26231c;
    --muted:#8d8674;
    --line:#e3dccb;
    --accent:#b4552d;          /* 朱砂 */
    --accent-soft:#f6e3d6;
    --link:#16647c;
    --link-soft:#d9ecf1;
    --shadow:0 1px 2px rgba(60,50,30,.06), 0 8px 24px rgba(60,50,30,.07);
    --serif:'Georgia','Times New Roman','Songti SC','SimSun',serif;
    --sans:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#181a1e;
    --surface:#202228;
    --surface2:#2a2d34;
    --ink:#e9e6df;
    --muted:#9d9789;
    --line:#363a42;
    --accent:#e08a5e;
    --accent-soft:#3a2a20;
    --link:#79b8cc;
    --link-soft:#1d323b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);line-height:1.65;
    -webkit-font-smoothing:antialiased;
    transition:background .3s,color .3s;
  }
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- 头部 ---------- */
  header{
    position:sticky;top:0;z-index:1000;
    overflow:visible;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .head-inner{
    max-width:1180px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    overflow:visible;
  }
  .brand{display:flex;flex-direction:column;line-height:1.2}
  .brand b{font-family:var(--serif);font-size:19px;letter-spacing:1px}
  .brand b .seal{color:var(--accent)}
  .brand small{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .search-wrap{flex:1;min-width:240px;position:relative}
  .search-box{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:999px;
    padding:9px 16px;transition:border-color .2s,box-shadow .2s;
  }
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-box .mag{opacity:.55}
  .search-box input{
    flex:1;border:none;outline:none;background:transparent;color:var(--ink);
    font-size:15px;font-family:var(--sans);min-width:0;
  }
  .search-box input::placeholder{color:var(--muted)}
  #suggest{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:1200;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);overflow:hidden;display:none;
  }
  #suggest a{
    display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    padding:10px 16px;border-bottom:1px solid var(--line);color:var(--ink);
  }
  #suggest a:last-child{border-bottom:none}
  #suggest a:hover,#suggest a.sel{background:var(--surface2);text-decoration:none}
  #suggest .sw{font-family:var(--serif);font-weight:700;font-size:16px}
  #suggest .sp{font-size:12px;color:var(--muted);white-space:nowrap}
  #suggest .sn{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  .head-actions{display:flex;gap:8px;align-items:center}
  .icon-btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;
    transition:border-color .2s,background .2s;
  }
  .icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}

  /* ---------- 主体 ---------- */
  main{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:flex;gap:26px;align-items:flex-start;position:relative;z-index:0}
  aside{
    width:250px;flex:none;position:sticky;top:78px;max-height:calc(100vh - 100px);
    overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:14px;box-shadow:var(--shadow);
  }
  aside h3{font-size:12px;letter-spacing:2px;color:var(--muted);margin:4px 8px 10px;font-weight:600}
  aside a{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    padding:7px 10px;border-radius:9px;color:var(--ink);border-left:3px solid transparent;
  }
  aside a:hover{background:var(--surface2);text-decoration:none}
  aside a.active{background:var(--accent-soft);border-left-color:var(--accent)}
  aside a b{font-family:var(--serif);font-size:16px}
  aside a i{font-style:normal;font-size:11.5px;color:var(--muted)}
  #detail{flex:1;min-width:0}

  /* 精选标记 / 首页分区 / 词性筛选 */
  .feat-badge{display:inline-block;font-size:11px;letter-spacing:1px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-weight:600;vertical-align:middle}
  .dom-badge{display:inline-block;font-size:11px;letter-spacing:.5px;color:var(--link);background:var(--link-soft);border-radius:999px;padding:3px 10px;font-weight:600;vertical-align:middle}
  .card .card-dom{display:inline-block;font-size:10.5px;color:var(--link);background:var(--link-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
  aside .d-filters{margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
  .home-sec{font-size:13px;letter-spacing:2.5px;color:var(--muted);font-weight:700;display:flex;align-items:baseline;gap:10px;margin:30px 0 14px}
  .home-sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .home-sec small{letter-spacing:1px;text-transform:uppercase;font-weight:400;opacity:.8}
  aside{display:flex;flex-direction:column}
  aside .cnt{font-weight:400;margin-left:6px;color:var(--accent)}
  aside .filters{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .fchip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;transition:all .15s}
  .fchip:hover{border-color:var(--accent);color:var(--accent)}
  .fchip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  aside .index-links{overflow:auto;flex:1;min-height:0}
  aside .empty{font-size:12.5px;color:var(--muted);padding:8px}

  /* ---------- 首页 ---------- */
  .hero{padding:14px 0 6px}
  .hero h1{font-family:var(--serif);font-size:clamp(28px,4.5vw,42px);margin:6px 0 10px;letter-spacing:.5px}
  .hero p{color:var(--muted);max-width:640px;margin:0 0 4px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 26px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
  .stat b{color:var(--accent);font-size:16px;margin-right:4px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    box-shadow:var(--shadow);transition:transform .18s,border-color .18s;display:block;color:var(--ink);
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent);text-decoration:none}
  .card .cw{font-family:var(--serif);font-size:21px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
  .card .cw small{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:400}
  .card .cd{font-size:13px;color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .cipa{margin-top:8px;font-size:12px;color:var(--link);font-family:var(--serif)}

  /* ---------- 词条页 ---------- */
  .entry{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow)}
  .entry-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:20px}
  .word-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .word-row h1{font-family:var(--serif);font-size:clamp(34px,5.5vw,46px);margin:0;letter-spacing:.5px}
  .word-full{margin-top:10px;font-size:15px;color:var(--link);font-family:var(--serif);font-style:italic}
  .ptag{
    display:inline-block;font-size:11.5px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:2px 8px;margin-right:5px;letter-spacing:.5px;
  }
  .ipa-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .ipa{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface2);color:var(--ink);
    border-radius:999px;padding:7px 14px;font-family:var(--serif);font-size:16px;
    transition:border-color .2s,transform .15s;
  }
  .ipa:hover{border-color:var(--link);transform:translateY(-1px)}
  .ipa .flag{font-size:12px;font-family:var(--sans);color:var(--muted);font-weight:600}
  .ipa .spk{font-size:13px}
  .head-note{font-size:12.5px;color:var(--muted);margin:12px 0 0}

  .sec{margin-top:24px}
  .sec>h2{
    font-size:13px;letter-spacing:2.5px;color:var(--muted);font-weight:700;
    display:flex;align-items:baseline;gap:10px;margin:0 0 14px;
  }
  .sec>h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .sec>h2 small{letter-spacing:1px;text-transform:uppercase;font-weight:400;opacity:.8}

  /* 变形 */
  .infl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .infl{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 13px}
  .infl .lbl{font-size:11.5px;color:var(--muted);letter-spacing:1px}
  .infl .frm{font-family:var(--serif);font-size:16px;margin-top:2px}
  .fl{border-bottom:1px dashed var(--link);cursor:pointer}
  .fl:hover{background:var(--link-soft);text-decoration:none;border-bottom-style:solid}
  .infl .sep{color:var(--muted);margin:0 4px}

  /* 释义 */
  ol.senses{list-style:none;margin:0;padding:0;counter-reset:sense}
  .sense{position:relative;padding:12px 0 14px 44px;counter-increment:sense;border-bottom:1px dashed var(--line)}
  .sense:last-child{border-bottom:none}
  .sense::before{
    content:counter(sense);position:absolute;left:0;top:13px;
    width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .sense-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sense-head .cn{font-weight:700;font-size:16.5px}
  .sense .en{color:var(--muted);font-family:var(--serif);font-size:15.5px;margin:5px 0 0}
  .sense .ex{font-size:14.5px;margin:8px 0 0;background:var(--surface2);border-radius:10px;padding:8px 12px}
  .collocs{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .colloc{font-size:12px;color:var(--link);background:var(--link-soft);border-radius:999px;padding:3px 11px}

  /* 例句/名言 */
  .quote{
    margin:0 0 16px;padding:16px 18px 14px;border-radius:14px;
    background:var(--surface2);border-left:4px solid var(--accent);position:relative;
  }
  .quote blockquote{
    margin:0;font-family:var(--serif);font-style:italic;font-size:17.5px;line-height:1.6;
  }
  .quote .qmark{position:absolute;right:14px;top:2px;font-family:var(--serif);font-size:52px;color:var(--accent);opacity:.18;line-height:1}
  .quote figcaption{margin-top:10px;font-size:12.5px;color:var(--accent);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .quote .qtype{background:var(--accent-soft);border-radius:999px;padding:1px 10px;font-size:11px;color:var(--accent)}
  .quote .qsrc{color:var(--muted);font-weight:400}
  .quote .qzh{font-size:13.5px;color:var(--muted);margin:7px 0 0;border-top:1px dashed var(--line);padding-top:7px}

  /* 相关词汇 */
  .related{display:flex;gap:8px;flex-wrap:wrap}
  .rchip{
    display:flex;flex-direction:column;gap:2px;
    background:var(--surface2);border:1px solid var(--line);border-radius:12px;
    padding:8px 14px;color:var(--ink);transition:border-color .2s,transform .15s;
  }
  .rchip:hover{border-color:var(--accent);transform:translateY(-2px);text-decoration:none}
  .rchip b{font-family:var(--serif);font-size:16px}
  .rchip i{font-style:normal;font-size:11.5px;color:var(--muted)}

  /* 变形词页 */
  .derived .dtag{display:inline-block;font-size:11.5px;letter-spacing:2px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 12px;margin-bottom:10px}
  .rel-box{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:12px 0}
  .rel-box p{margin:0 0 8px;color:var(--muted);font-size:13.5px}
  .rel-line{display:flex;align-items:baseline;gap:8px;margin:6px 0;font-size:15px}
  .rel-line b{font-family:var(--serif);font-size:18px}
  .rel-line .rel-note{color:var(--muted);font-size:13px;background:var(--surface);border-radius:8px;padding:2px 10px}
  .btn-back{
    display:inline-block;margin-top:16px;background:var(--accent);color:#fff;border-radius:999px;
    padding:10px 20px;font-size:14.5px;font-weight:600;transition:filter .2s;
  }
  .btn-back:hover{filter:brightness(1.08);text-decoration:none;color:#fff}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px}
  .nfound{text-align:center;padding:40px 20px}
  .nfound h1{font-family:var(--serif)}
  .nfound .sug{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .nfound .sug a{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;color:var(--ink);font-family:var(--serif)}
  .nfound .sug a:hover{border-color:var(--accent);text-decoration:none}

  footer{
    max-width:1180px;margin:0 auto;padding:0 20px 40px;text-align:center;
    font-size:12.5px;color:var(--muted);
  }
  footer .rule{border:none;border-top:1px solid var(--line);margin:0 0 16px}

  @media (max-width:900px){
    main{flex-direction:column}
    aside{width:100%;position:static;max-height:210px}
    .entry{padding:20px 16px}
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <a class="brand" href="#/" style="color:var(--ink)">
      <b>中英双语词典<span class="seal"> · </span>Bilingual Dictionary</b>
      <small>Word · IPA · Examples · Quotes</small>
    </a>
    <div class="search-wrap">
      <div class="search-box">
        <span class="mag">🔍</span>
        <input id="search" type="text" placeholder="输入英文或中文检索，如 dream / 梦想 / believe" autocomplete="off" spellcheck="false">
      </div>
      <div id="suggest"></div>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="rand" title="随机一词">🎲 随机</button>
      <button class="icon-btn" id="theme" title="切换明暗主题">🌙</button>
    </div>
  </div>
</header>

<main>
  <aside id="index"></aside>
  <section id="detail"></section>
</main>

<footer>
  <hr class="rule">
  <p>收录 <b id="stat-words">0</b> 个词条，自动关联 <b id="stat-derived">0</b> 个变形/相关词。发音使用浏览器内置语音合成（Web Speech API）。</p>
  <p>部分名言为广泛流传的常见出处标注；例句中的电影台词与名人名言均注明来源。直接双击本文件即可离线使用。</p>
</footer>

<script>
"use strict";

/* ================= 精选词条数据（含名言/电影台词出处） ================= */
const FEATURED = {
  dream: {
    pos: ["n.", "v."],
    ipa: { us: "driːm", uk: "driːm" },
    note: "美式与英式发音相同；动词过去式 dreamed / dreamt 两种写法均可。",
    senses: [
      { pos: "n.", cn: "梦，梦境", en: "a series of images, events and feelings that happen in your mind while you are asleep", ex: "I had a strange dream last night. 我昨晚做了一个奇怪的梦。", colloc: ["sweet dreams 好梦", "a dream come true 梦想成真"] },
      { pos: "n.", cn: "梦想，理想，抱负", en: "something that you want very much to happen; a strong wish or ambition", ex: "She finally realized her dream of becoming a doctor. 她终于实现了当医生的梦想。", colloc: ["dream of / about doing sth 梦想做某事", "dream job 梦寐以求的工作"] },
      { pos: "n.", cn: "美好的人或事物", en: "a person or thing that is very beautiful, perfect or pleasant", ex: "The house by the lake is an absolute dream. 湖边那栋房子简直美极了。" },
      { pos: "v.", cn: "做梦，梦见", en: "to experience images and events in your mind while you are asleep", ex: "I dreamed I was flying over the sea. 我梦见自己飞越大海。" },
      { pos: "v.", cn: "梦想，渴望", en: "to wish for something very much, especially something you may never have", ex: "He dreams of owning his own business one day. 他梦想着有一天拥有自己的公司。" }
    ],
    quotes: [
      { type: "演讲", en: "I have a dream that my four little children will one day live in a nation where they will not be judged by the color of their skin but by the content of their character.", zh: "我有一个梦想：我的四个孩子将有一天生活在一个不以肤色、而以品格来评判他们的国度。", src: "Martin Luther King Jr. — “I Have a Dream” (1963)" },
      { type: "电影", en: "A dream is a wish your heart makes.", zh: "梦想，是心灵许下的愿望。", src: "Cinderella 《灰姑娘》— Disney (1950)" },
      { type: "名言", en: "All our dreams can come true, if we have the courage to pursue them.", zh: "只要我们有勇气去追求，所有的梦想都能成真。", src: "Walt Disney（常见出处标注）" }
    ],
    inflections: [
      { label: "复数", forms: "dreams" },
      { label: "第三人称单数", forms: "dreams" },
      { label: "过去式", forms: "dreamed / dreamt" },
      { label: "过去分词", forms: "dreamed / dreamt" },
      { label: "现在分词", forms: "dreaming" }
    ],
    related: [
      { word: "dreamer", note: "n. 梦想家" },
      { word: "dreamy", note: "adj. 梦幻的" },
      { word: "daydream", note: "n./v. 白日梦" }
    ]
  },

  time: {
    pos: ["n.", "v."],
    ipa: { us: "taɪm", uk: "taɪm" },
    senses: [
      { pos: "n.", cn: "时间", en: "what is measured in minutes, hours, days, years, etc.", ex: "Time passes quickly when you're absorbed in work. 专心工作时时间过得飞快。", colloc: ["on time 准时", "in time 及时", "time flies 时光飞逝"] },
      { pos: "n.", cn: "时刻，钟点", en: "a particular point in the day shown by a clock", ex: "What time does the train leave? 火车几点发车？" },
      { pos: "n.", cn: "次数，回，倍", en: "an occasion when something happens, or the number of times it happens", ex: "I've told you many times — don't be late. 我跟你说过很多次了——别迟到。" },
      { pos: "n.", cn: "时代，时期", en: "a particular period in history or in a person's life", ex: "These are difficult times for small businesses. 对小企业来说，这是艰难的时期。" },
      { pos: "v.", cn: "为……计时；安排……的时间", en: "to measure how long something takes, or to arrange when something happens", ex: "The race was timed to the nearest second. 比赛计时精确到秒。" }

function pluralOf(w) {
  if (NO_PLURAL.has(w)) return null;
  if (IRREGULAR_PLURALS[w]) return IRREGULAR_PLURALS[w];
  if (/[sxz]$/.test(w) || /(ch|sh)$/.test(w)) return w + "es";
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + "ies";
  return w + "s";
}
function thirdOf(w) {
  if (w === "be") return "is";
  if (w === "have") return "has";
  if (/[sxz]$/.test(w) || /(ch|sh)$/.test(w)) return w + "es";
  if (/[^aeiou]o$/.test(w)) return w + "es";       // do→does, go→goes
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + "ies";
  return w + "s";
}
function pastOf(w) {
  if (IRREGULAR_VERBS[w]) return IRREGULAR_VERBS[w][0];
  if (/e$/.test(w)) return w + "d";
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + "ied";
  if (DOUBLE_CONSONANT.has(w)) return w + w.slice(-1) + "ed";
  if (/^[^aeiouy]+[aeiou][^aeiouwxy]$/.test(w) && w.length <= 4) return w + w.slice(-1) + "ed";
  return w + "ed";
}
function ppOf(w) {
  if (IRREGULAR_VERBS[w]) return IRREGULAR_VERBS[w][1];
  return pastOf(w);
}
function ingOf(w) {
  if (/ie$/.test(w)) return w.slice(0, -2) + "ying";
  if (/e$/.test(w) && !/ee$/.test(w) && w !== "be") return w.slice(0, -1) + "ing";
  if (DOUBLE_CONSONANT.has(w)) return w + w.slice(-1) + "ing";
  if (/^[^aeiouy]+[aeiou][^aeiouwxy]$/.test(w) && w.length <= 4) return w + w.slice(-1) + "ing";
  return w + "ing";
}
function comparativeOf(w) {
  if (NO_COMPARATIVE.has(w)) return null;
  if (IRREGULAR_ADJ[w]) return IRREGULAR_ADJ[w];
  if (/[^aeiou]y$/.test(w)) return [w.slice(0, -1) + "ier", w.slice(0, -1) + "iest"];
  if (/e$/.test(w) && w.length <= 5) return [w + "r", w + "st"];   // cute→cuter, nice→nicer
  if (/^[^aeiouy]+[aeiou][^aeiouwxy]$/.test(w) && w.length <= 4) return [w + w.slice(-1) + "er", w + w.slice(-1) + "est"];
  if (w.length <= 5 && !/ful$|less$|ous$|ive$|ing$|ed$|al$|ic$|ish$|en$|an$|ly$|ow$/.test(w))
    return [w + "er", w + "est"];
  return ["more " + w, "most " + w];
}

function autoInflections(word, posStr) {
  const out = [];
  if (posStr.includes("n.")) {
    const p = pluralOf(word);
    if (p) out.push({ label: "复数", forms: p });
  }
  if (posStr.includes("v.") && !MODAL_VERBS.has(word)) {
    out.push({ label: "第三人称单数", forms: thirdOf(word) });
    out.push({ label: "过去式", forms: pastOf(word) });
    out.push({ label: "过去分词", forms: ppOf(word) });
    out.push({ label: "现在分词", forms: ingOf(word) });
  }
  if (posStr.includes("adj.")) {
    const c = comparativeOf(word);
    if (c) { out.push({ label: "比较级", forms: c[0] }); out.push({ label: "最高级", forms: c[1] }); }
  }
  return out;
}

function normColloc(c) {
  if (!c) return null;
  if (Array.isArray(c)) return c;
  return String(c).split(/[；;]/).map(s => s.trim()).filter(Boolean);
}

const FULL_SPECIAL = { "op-amp": "operational amplifier", "RS-232": "Recommended Standard 232", "PVT": "Process, Voltage and Temperature" };
function extractFull(word, sensesArr) {
  if (FULL_SPECIAL[word]) return FULL_SPECIAL[word];
  const en = (sensesArr && sensesArr[0] && sensesArr[0][2]) || "";
  const m = en.match(/^([A-Z][A-Za-z0-9 ./-]{3,90}?)[,，]/);
  return m ? m[1].trim() : null;
}

      pos: posStr.split(/\s+/).filter(Boolean),
      ipa: { us: ipaUS, uk: ipaUK },
      senses: (senses || []).map(s => ({
        pos: s[0], cn: s[1], en: s[2],
        ex: s[3] || null, colloc: normColloc(s[4])
      })),
      quotes: [],
      inflections: inflOv ? inflOv.map(([label, forms]) => ({ label, forms })) : autoInflections(word, posStr),
      related: (related || []).map(([rw, rn]) => ({ word: rw, note: rn })),
      note: note || null,
      feat: false,
      dom: DOM_LABEL[dom] ? dom : null,
      full: extractFull(word, senses)
    };
  }
  return out;
}

/* ================= 合并词库 ================= */
const DOM_LABEL = {
  analog: "🎛️ 模拟", digital: "🔢 数字", interface: "🔌 接口·协议",
  device: "🔩 器件·工艺", eda: "🛠️ 设计·EDA", system: "📟 系统·嵌入式", power: "🔋 电源"
};

// 合并新条目：已存在的词条（通用/精选）与新义项合并，而不是覆盖
function mergeWord(existing, add) {
  const pos = [...new Set([...existing.pos, ...add.pos])];
  const senses = [...existing.senses, ...add.senses];
  const related = [...(existing.related || []), ...(add.related || [])];
  const inflMap = new Map();
  for (const it of [...(existing.inflections || []), ...(add.inflections || [])]) {
    inflMap.set(it.label + "\u0000" + it.forms, it);
  }
  return Object.assign({}, existing, {
    pos, senses, related,
    inflections: [...inflMap.values()],
    dom: existing.dom || add.dom || null
  });
}

const WORDS = {};
for (const [k, v] of Object.entries(FEATURED)) WORDS[k] = Object.assign({}, v, { feat: true });
// 先合并通用词，最后合并专业领域词（EECS）
const commonNames = Object.keys(window).filter(k => /^COMMON_[A-Z]+$/.test(k) && k !== "COMMON_EECS").sort();
const eecsNames = Object.keys(window).filter(k => k === "COMMON_EECS");
for (const arrName of [...commonNames, ...eecsNames]) {
  const added = buildCommon(window[arrName]);
  for (const [k, v] of Object.entries(added)) {
    WORDS[k] = WORDS[k] ? mergeWord(WORDS[k], v) : v;
  }
}

/* ================= 变形/相关词反向索引 ================= */
const DERIVED = {};   // 变形词 -> [{base, rel}]
const INDEX = [];     // 搜索索引

const QUOTE_BADGE = { "电影": "🎬", "名言": "✒️", "歌词": "🎵", "文学": "📖", "谚语": "🏺", "演讲": "🗣️", "剧集": "📺" };
const SKIP_WORDS = new Set(["more", "most", "less", "least"]);

(function buildIndex() {
  for (const [head, w] of Object.entries(WORDS)) {
    for (const it of (w.inflections || [])) {
      for (const tok of it.forms.split("/")) {
        for (const word of tok.trim().split(/\s+/)) {
          if (!word || SKIP_WORDS.has(word)) continue;
          (DERIVED[word] = DERIVED[word] || []).push({ base: head, rel: it.label });
        }
      }
    }
    for (const r of (w.related || [])) {
      (DERIVED[r.word] = DERIVED[r.word] || []).push({ base: head, rel: r.note });
    }
    const zh = [...w.senses.map(s => s.cn), ...w.quotes.map(q => q.zh), w.note || ""].join(" ");
    const en = [...w.senses.map(s => s.en), ...w.quotes.map(q => q.en)].join(" ");
    INDEX.push({ key: head, word: head, pos: w.pos.join(" · "), zh, en });
  }
  for (const [tok, list] of Object.entries(DERIVED)) {
    INDEX.push({
      key: tok, word: tok, pos: "变形/相关",
      zh: "与 " + [...new Set(list.map(l => l.base))].join("、") + " 相关",
      en: list.map(l => l.base + " (" + l.rel + ")").join("; ")
    });
  }
  INDEX.sort((a, b) => a.word.localeCompare(b.word));
})();

/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function speak(text, lang) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;          // en-US / en-GB
    u.rate = 0.82;
    speechSynthesis.speak(u);
  } catch (e) { /* 忽略 */ }
}

function ipaChip(label, lang, ipa, word) {
  return `<button class="ipa" data-speak="${esc(word)}" data-lang="${lang}" title="点击收听发音">` +
    `<span class="flag">${label}</span>/${ipa}/<span class="spk">🔊</span></button>`;
}

function formLinks(forms) {
  return forms.split("/").map(tok => tok.trim())
    .map(tok => tok.split(/\s+/).map(word => {
      if (WORDS[word] || DERIVED[word]) return `<a class="fl" href="#/${esc(word)}">${esc(word)}</a>`;
      return `<span>${esc(word)}</span>`;
    }).join(" "))
    .join('<span class="sep"> / </span>');
}

/* ================= 渲染：词条主页 ================= */
function renderFull(w, head) {
  head = head || w.head || "";
  const pos = w.pos.map(p => `<span class="ptag">${esc(p)}</span>`).join("");
  const senses = w.senses.map((s, i) => `
    <li class="sense">
      <div class="sense-head"><span class="ptag">${esc(s.pos)}</span><span class="cn">${esc(s.cn)}</span></div>
      <p class="en">${esc(s.en)}</p>
      ${s.ex ? `<p class="ex">💬 ${esc(s.ex)}</p>` : ""}
      ${s.colloc ? `<div class="collocs">${s.colloc.map(c => `<span class="colloc">${esc(c)}</span>`).join("")}</div>` : ""}
    </li>`).join("");

  const quotes = w.quotes && w.quotes.length ? w.quotes.map(q => `
    <figure class="quote">
      <span class="qmark">“</span>
      <blockquote>${esc(q.en)}</blockquote>
      <figcaption>
        <span class="qtype">${QUOTE_BADGE[q.type] || "✒️"} ${esc(q.type)}</span>
        <span class="qsrc">${esc(q.src)}</span>
      </figcaption>
      <p class="qzh">${esc(q.zh)}</p>
    </figure>`).join("") : "";

  const inflections = w.inflections ? `
    <section class="sec">
      <h2><span>词形变化</span><small>Inflections · 点击可跳转到该词主页</small></h2>
      <div class="infl-grid">
        ${w.inflections.map(it => `
          <div class="infl">
            <div class="lbl">${esc(it.label)}</div>
            <div class="frm">${formLinks(it.forms)}</div>
          </div>`).join("")}
      </div>
    </section>` : "";

  const related = (w.related && w.related.length) ? `
    <section class="sec">
      <h2><span>相关词汇</span><small>Related Words</small></h2>
      <div class="related">
        ${w.related.map(r => `<a class="rchip" href="#/${esc(r.word)}"><b>${esc(r.word)}</b><i>${esc(r.note)}</i></a>`).join("")}
      </div>
    </section>` : "";

  return `
  <article class="entry">
    <header class="entry-head">
      <div class="word-row">
        <h1>${esc(head)}</h1>
        <div>${pos}</div>
        ${w.dom ? `<span class="dom-badge" title="专业领域">${esc(DOM_LABEL[w.dom] || w.dom)}</span>` : ""}
        ${w.feat ? `<span class="feat-badge" title="精选词条：例句为电影台词或名人名言并标注出处">★ 精选</span>` : ""}
      </div>
      ${w.full ? `<div class="word-full">${esc(w.full)}（${esc(w.senses[0].cn)}）</div>` : ""}
      <div class="ipa-row">
        ${ipaChip("美", "en-US", w.ipa.us, head)}
        ${ipaChip("英", "en-GB", w.ipa.uk, head)}
      </div>
      ${w.note ? `<p class="head-note">💡 ${esc(w.note)}</p>` : ""}
    </header>

    ${inflections}

    <section class="sec">
      <h2><span>详细释义</span><small>Definitions</small></h2>
      <ol class="senses">${senses}</ol>
    </section>

    ${quotes ? `
    <section class="sec">
      <h2><span>例句 · 名言</span><small>Examples & Quotes · 均标注出处</small></h2>
      <div class="quotes">${quotes}</div>
    </section>` : ""}

    ${related}
  </article>`;
}

/* ================= 渲染：变形词页 ================= */
function renderDerived(key) {
  const list = DERIVED[key];
  const bases = [...new Set(list.map(l => l.base))];
  const base = bases[0];
  const w = WORDS[base];
  return `
  <article class="entry derived">
    <span class="dtag">变形词 · 相关词</span>
    <div class="word-row"><h1>${esc(key)}</h1><div><span class="ptag">${esc(list[0].rel)}</span></div></div>

    <div class="rel-box">
      <p>这是以下主词条的变形或相关形式（点击跳转到对应词条主页）：</p>
      ${list.map(l => `
        <div class="rel-line">
          <a href="#/${esc(l.base)}"><b>${esc(l.base)}</b></a>
          <span class="rel-note">${esc(l.rel)}</span>
        </div>`).join("")}
    </div>

    <div class="ipa-row">
      ${ipaChip("美", "en-US", w.ipa.us, base)}
      ${ipaChip("英", "en-GB", w.ipa.uk, base)}
    </div>
    <p class="hint">发音与主词条 ${esc(base)} 相同，完整释义、例句与变形请查看主词条。</p>

    <a class="btn-back" href="#/${esc(base)}">← 查看「${esc(base)}」完整词条</a>
    <p class="hint">💡 在本词典中，任意词形变化（复数、过去式、比较级等）都可以点击切换到对应词条主页。</p>
  </article>`;
}

/* ================= 渲染：未收录 ================= */
function renderNotFound(key) {
  const q = key.toLowerCase();
  const cands = INDEX.filter(i => i.word.includes(q) || i.zh.includes(key)).slice(0, 12);
  return `
  <article class="entry nfound">
    <h1>🤔 “${esc(key)}” 未收录</h1>
    <p>该词不在当前词库中，试试下面的相近词条：</p>
    <div class="sug">${cands.map(c => `<a href="#/${esc(c.word)}">${esc(c.word)}</a>`).join("") || "<span>（暂无相近词条）</span>"}</div>
    <p class="hint">提示：本词库为演示词典，可在 <code>index.html</code> 的 WORDS 数据中自行添加词条。</p>
  </article>`;
}

/* ================= 渲染：首页 ================= */
function renderHome() {
  const sorted = Object.entries(WORDS).sort((a, b) => a[0].localeCompare(b[0]));
  const card = ([head, w]) => `
    <a class="card" href="#/${esc(head)}"${w.full ? ` title="${esc(w.full)}"` : ""}>
      <div class="cw">${w.feat ? "★ " : ""}${esc(head)}<small>${esc(w.pos.join(" · "))}</small></div>
      <div class="cd">${esc(w.senses[0].cn)}${w.dom ? `<span class="card-dom">${esc(DOM_LABEL[w.dom])}</span>` : ""}</div>
      <div class="cipa">/${w.ipa.us}/</div>
    </a>`;
  const featured = sorted.filter(([, w]) => w.feat).map(card).join("");
  const rest = sorted.filter(([, w]) => !w.feat).map(card).join("");
  const eecsCount = Object.values(WORDS).filter(w => w.dom).length;
  return `
  <div class="hero">
    <h1>中英双语词典 <span style="color:var(--accent)">Bilingual Dictionary</span></h1>
    <p>收录常用核心词汇 + 电子工程/IC 设计专业术语：详细释义（中英对照）、词形变化（可点击跳转）、经典例句，并附美式 / 英式音标与真人发音。标注 ★ 的精选词条，其例句为电影台词或名人名言并注明出处。</p>
    <div class="stats">
      <span class="stat"><b>${Object.keys(WORDS).length}</b>个主词条</span>
      <span class="stat"><b>${Object.keys(DERIVED).length}</b>个变形/相关词</span>
      <span class="stat"><b>${eecsCount}</b>个专业领域词条</span>
      <span class="stat"><b>${Object.values(WORDS).reduce((n, w) => n + (w.quotes ? w.quotes.length : 0), 0)}</b>条名言/台词</span>
      <span class="stat">🎧 美/英 双发音</span>
    </div>
    ${featured ? `
    <h2 class="home-sec"><span>精选词条</span><small>Featured · 例句为名言/电影台词并标注出处</small></h2>
    <div class="card-grid">${featured}</div>` : ""}
    <h2 class="home-sec"><span>全部词条</span><small>Common Words + 电子/IC 专业术语 · A–Z</small></h2>
    <div class="card-grid">${rest}</div>
  </div>`;
}

/* ================= 路由 ================= */
// 大小写不敏感词表索引（ASIC、I2C、MOSFET 等缩写词）
const KEYMAP = {};
function rebuildKeymap() {
  for (const k of Object.keys(WORDS)) {
    const lk = k.toLowerCase();
    if (!(lk in KEYMAP)) KEYMAP[lk] = k;
  }
  for (const k of Object.keys(DERIVED)) {
    const lk = k.toLowerCase();
    if (!(lk in KEYMAP)) KEYMAP[lk] = k;
  }
}

function route() {
  const raw = location.hash.replace(/^#\/?/, "");
  const key = decodeURIComponent(raw).trim().toLowerCase();
  const realKey = key ? (WORDS[key] ? key : (KEYMAP[key] || key)) : "";
  const detail = $("#detail");
  if (!realKey) {
    detail.innerHTML = renderHome();
  } else if (WORDS[realKey]) {
    detail.innerHTML = renderFull(WORDS[realKey], realKey);
  } else if (DERIVED[realKey]) {
    detail.innerHTML = renderDerived(realKey);
  } else {
    detail.innerHTML = renderNotFound(realKey);
  }
  document.querySelectorAll("#index a").forEach(a =>
    a.classList.toggle("active", (a.dataset.word || "").toLowerCase() === key));
  detail.scrollTop = 0;
  window.scrollTo({ top: 0 });
}

/* ================= 左侧索引 ================= */
let posFilter = "全部";
let domFilter = "全部";

function wordCat(w) {
  const p = w.pos.join(" ");
  if (p.includes("n.")) return "名词";
  if (p.includes("v.")) return "动词";
  if (p.includes("adj.")) return "形容词";
  if (p.includes("adv.")) return "副词";
  return "其他";
}

function wordDom(w) { return w.dom ? DOM_LABEL[w.dom] : "通用"; }

function renderIndex() {
  const cats = ["全部", "名词", "动词", "形容词", "副词", "其他"];
  const doms = ["全部", "通用", ...Object.values(DOM_LABEL)];
  const chips = cats.map(c => `<button class="fchip${c === posFilter ? " active" : ""}" data-cat="${c}">${c}</button>`).join("");
  const dchips = doms.map(d => `<button class="fchip dchip${d === domFilter ? " active" : ""}" data-dom="${d}">${d}</button>`).join("");
  const list = Object.entries(WORDS)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .filter(([, w]) => (posFilter === "全部" || wordCat(w) === posFilter) &&
                        (domFilter === "全部" || wordDom(w) === domFilter))
    .map(([head, w]) => `
      <a href="#/${esc(head)}" data-word="${esc(head)}"${w.full ? ` title="${esc(w.full)}"` : ""}>
        <b>${w.feat ? "★ " : ""}${esc(head)}</b><i>${esc(w.pos[0])}</i>
      </a>`).join("");
  $("#index").innerHTML =
    `<h3>词条列表 · A–Z<span class="cnt">${Object.keys(WORDS).length}</span></h3>` +
    `<div class="filters">${chips}</div>` +
    `<div class="filters d-filters">${dchips}</div>` +
    `<div class="index-links">${list || `<p class="empty">当前筛选下暂无词条</p>`}</div>`;
}

/* ================= 搜索 ================= */
const searchInput = $("#search");
const suggestBox = $("#suggest");
let selIdx = -1, lastQuery = "";

function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { suggestBox.style.display = "none"; return; }
  // 统一用小写比较：精确匹配(0) > 前缀(1) > 包含(2) > 中文/释义匹配(3)，次级按字母序（不区分大小写）
  const scored = [];
  for (const item of INDEX) {
    const w = item.word.toLowerCase();
    const score = w === q ? 0 : w.startsWith(q) ? 1 : w.includes(q) ? 2 :
      (item.zh.includes(q) || item.en.toLowerCase().includes(q)) ? 3 : -1;
    if (score >= 0) scored.push({ i: item, score });
  }
  scored.sort((a, b) => a.score - b.score || a.i.word.toLowerCase().localeCompare(b.i.word.toLowerCase()));
  const items = scored.slice(0, 8);
  lastQuery = q;
  selIdx = -1;
  if (!items.length) { suggestBox.style.display = "none"; return; }
  suggestBox.innerHTML = items.map((it, n) => `
    <a href="#/${esc(it.i.word)}" data-idx="${n}">
      <span class="sw">${esc(it.i.word)}</span>
      <span class="sp">${esc(it.i.pos)}</span>
      <span class="sn">${esc(it.i.zh.slice(0, 40))}</span>
    </a>`).join("");
  suggestBox.style.display = "block";
  markSel();
}

function markSel() {
  suggestBox.querySelectorAll("a").forEach(a => a.classList.toggle("sel", +a.dataset.idx === selIdx));
  const cur = suggestBox.querySelector(`a[data-idx="${selIdx}"]`);
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

searchInput.addEventListener("input", () => doSearch(searchInput.value));
searchInput.addEventListener("keydown", e => {
  const items = suggestBox.querySelectorAll("a");
  if (!items.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); selIdx = (selIdx + 1) % items.length; markSel(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); selIdx = (selIdx - 1 + items.length) % items.length; markSel(); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (selIdx >= 0 && items[selIdx]) location.hash = items[selIdx].getAttribute("href").slice(1);
    else if (items[0]) location.hash = items[0].getAttribute("href").slice(1);
    suggestBox.style.display = "none";
    searchInput.blur();
  } else if (e.key === "Escape") suggestBox.style.display = "none";
});
document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrap")) suggestBox.style.display = "none";
});
suggestBox.addEventListener("click", () => { suggestBox.style.display = "none"; });

/* ================= 全局事件 ================= */
document.addEventListener("click", e => {
  const d = e.target.closest(".dchip");
  if (d) { domFilter = d.dataset.dom; renderIndex(); return; }
  const f = e.target.closest(".fchip");
  if (f) { posFilter = f.dataset.cat; renderIndex(); return; }
  const b = e.target.closest("[data-speak]");
  if (b) speak(b.dataset.speak, b.dataset.lang);
});

$("#rand").addEventListener("click", () => {
  const keys = Object.keys(WORDS);
  location.hash = "#/" + keys[Math.floor(Math.random() * keys.length)];
});

$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", cur ? "light" : "dark");
  $("#theme").textContent = cur ? "🌙" : "☀️";
  localStorage.setItem("dict-theme", cur ? "light" : "dark");
});

/* ================= 初始化 ================= */
(function init() {
  const saved = localStorage.getItem("dict-theme");
  const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("#theme").textContent = dark ? "☀️" : "🌙";

  rebuildKeymap();
  renderIndex();
  $("#stat-words").textContent = Object.keys(WORDS).length;
  $("#stat-derived").textContent = Object.keys(DERIVED).length;

  window.addEventListener("hashchange", route);
  route();
})();
</script>
