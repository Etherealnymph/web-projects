<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>词汇选择题刷题网页 - 180题题库</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --ink:#20242a; --muted:#677184;
      --line:#dfe4ee; --accent:#315efb; --ok:#16833a; --bad:#c62828;
      --soft:#eef3ff; --warn:#fff7e6;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;line-height:1.55}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    h1{font-size:22px;margin:0 0 6px}
    .sub{color:var(--muted);font-size:14px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0;box-shadow:0 4px 14px rgba(20,30,55,.04)}
    .controls{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end}
    label.small{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
    select,input[type="text"]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;font-size:14px}
    button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
    button:hover{border-color:var(--accent);color:var(--accent)}
    button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    button.primary:hover{filter:brightness(.95);color:#fff}
    button.danger{border-color:#ffd4d4;color:var(--bad);background:#fff8f8}
    button.good{border-color:#ccebd6;color:var(--ok);background:#f6fff8}
    .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;color:var(--muted);font-size:13px}
    .pill{background:var(--soft);border:1px solid #dce6ff;border-radius:999px;padding:4px 9px}
    .question-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
    .tag{font-size:13px;color:#32415f;background:#eef3ff;border:1px solid #dbe5ff;border-radius:999px;padding:4px 9px}
    .stem{font-size:18px;margin:10px 0 16px;white-space:normal}
    .stem .blank{letter-spacing:1px}
    .options{display:grid;gap:10px}
    .option{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
    .option:hover{border-color:#b8c7ff;background:#fbfcff}
    .option input{margin-top:4px}
    .option.correct{border-color:#9ad2ad;background:#f2fbf5}
    .option.wrong{border-color:#f0aaaa;background:#fff5f5}
    .option .letter{font-weight:700;min-width:24px}
    .feedback{margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fafcff;display:none}
    .feedback.ok{display:block;border-color:#bde1c7;background:#f3fff6;color:#145f2c}
    .feedback.bad{display:block;border-color:#f3b7b7;background:#fff6f6;color:#8b1f1f}
    .feedback.info{display:block;border-color:#cbd7f8;background:#f6f8ff;color:#253a75}
    .nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    .two-col{display:grid;grid-template-columns:1fr 330px;gap:16px}
    .side h3{margin:0 0 10px;font-size:16px}
    .mini-list{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
    .mini-item{padding:9px 10px;border-bottom:1px solid #eef1f6;cursor:pointer;font-size:13px;color:#435067}
    .mini-item:last-child{border-bottom:0}
    .mini-item:hover,.mini-item.active{background:#eef3ff;color:#1f43b5}
    .wrong-badge{font-size:12px;color:#fff;background:var(--bad);border-radius:999px;padding:1px 7px;margin-left:6px}
    .full-list{display:none}
    .full-list.show{display:block}
    details{border:1px solid var(--line);border-radius:12px;background:#fff;margin:10px 0;overflow:hidden}
    summary{cursor:pointer;padding:12px;font-weight:600;background:#fbfcff}
    .detail-body{padding:12px 14px}
    .ans{font-weight:700;color:var(--ok)}
    .note{font-size:13px;color:var(--muted)}
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 5px}
    @media (max-width:900px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.side{order:-1}.mini-list{max-height:220px}}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>词汇选择题刷题网页</h1>
      <div class="sub">题库共 180 题：词汇测试13复习1 + 词汇测试14复习2。选项顺序保持原题形式；错题库保存在本机浏览器 localStorage。</div>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="controls">
        <div>
          <label class="small">题库范围</label>
          <select id="setFilter">
            <option value="all">全部 180 题</option>
            <option value="13">词汇测试13复习1</option>
            <option value="14">词汇测试14复习2</option>
            <option value="wrong">错题库</option>
          </select>
        </div>
        <div>
          <label class="small">练习方式</label>
          <select id="orderMode">
            <option value="sequential">顺序练习</option>
            <option value="random">随机练习</option>
          </select>
        </div>
        <div>
          <label class="small">题号/关键词搜索</label>
          <input id="searchBox" type="text" placeholder="如 67 / migrant / oath" />
        </div>
        <button id="startBtn" class="primary">开始/刷新</button>
        <button id="randomBtn">随机一题</button>
        <button id="toggleListBtn">展开全部题</button>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="two-col">
      <div>
        <section class="panel" id="quizCard">
          <div class="question-top">
            <div>
              <span class="tag" id="qTag">-</span>
              <span class="tag" id="progressTag">-</span>
            </div>
            <div class="note">快捷键：<span class="kbd">A/B/C/D</span> 选项，<span class="kbd">Enter</span> 提交，<span class="kbd">←/→</span> 上下题</div>
          </div>
          <div class="stem" id="stem">加载中...</div>
          <div class="options" id="options"></div>
          <div id="feedback" class="feedback"></div>
          <div class="nav">
            <button id="prevBtn">上一题</button>
            <button id="nextBtn">下一题</button>
            <button id="submitBtn" class="primary">提交答案</button>
            <button id="showBtn">显示答案</button>
            <button id="addWrongBtn" class="danger">加入错题库</button>
            <button id="removeWrongBtn" class="good">移出错题库</button>
            <button id="resetStatsBtn">清空本次统计</button>
          </div>
        </section>

        <section class="panel full-list" id="fullListPanel">
          <h2 style="font-size:18px;margin:0 0 8px">全部题目列表</h2>
          <div class="note">展开后可直接查看题干、选项和正确答案，适合考前快速过一遍。</div>
          <div id="fullList"></div>
        </section>
      </div>

      <aside class="panel side">
        <h3>当前题目列表</h3>
        <div class="note" style="margin-bottom:8px">点击可跳转。红色标记表示已进入错题库。</div>
        <div id="miniList" class="mini-list"></div>
        <div class="nav">
          <button id="exportWrongBtn">导出错题</button>
          <button id="importWrongBtn">导入错题</button>
          <button id="clearWrongBtn" class="danger">清空错题库</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
  const QUESTIONS = [{"set":"13","source":"词汇测试13_复习1","id":1,"stem":"Economists warn that enormous pressures in the region could build up, forcing people to _____ eastwards to areas with more job opportunities.","options":{"A":"immigrate","B":"emigrate","C":"immigrant","D":"emigrant"},"answer":"B","answerText":"emigrate","uid":"T13-1","globalIndex":1},{"set":"13","source":"词汇测试13_复习1","id":2,"stem":"Witnesses were asked to stick to the facts and leave _________ all emotion and sentiment.","options":{"A":"aside","B":"out","C":"behind","D":"alone"},"answer":"A","answerText":"aside","uid":"T13-2","globalIndex":2},{"set":"13","source":"词汇测试13_复习1","id":3,"stem":"As a senior clerk of the company, most of his jobs are essentially desk-bound, and [clerical] or managerial in nature.","options":{"A":"numerical","B":"administrative","C":"academic","D":"technical"},"answer":"B","answerText":"administrative","uid":"T13-3","globalIndex":3},{"set":"13","source":"词汇测试13_复习1","id":4,"stem":"This company is ready to roll ________ a trial program to spur sales of electric automobiles and vehicles.","options":{"A":"over","B":"up","C":"out","D":"away"},"answer":"C","answerText":"out","uid":"T13-4","globalIndex":4},{"set":"13","source":"词汇测试13_复习1","id":5,"stem":"During the Chengdu World University Games, some areas of Chengdu implemented ________ Day Driving policy.","options":{"A":"Alternated","B":"Alternative","C":"Alternate","D":"Alterable"},"answer":"C","answerText":"Alternate","uid":"T13-5","globalIndex":5},{"set":"13","source":"词汇测试13_复习1","id":6,"stem":"After the _____ of last week's defeat, the Yankees were back on form and wanted to win their honor back.","options":{"A":"humidity","B":"humility","C":"humiliation","D":"humanity"},"answer":"C","answerText":"humiliation","uid":"T13-6","globalIndex":6},{"set":"13","source":"词汇测试13_复习1","id":7,"stem":"The reason for my recommendation is that this film gives us a peep _____ the curtain at a Broadway musical.","options":{"A":"around","B":"behind","C":"over","D":"under"},"answer":"B","answerText":"behind","uid":"T13-7","globalIndex":7},{"set":"13","source":"词汇测试13_复习1","id":8,"stem":"After years of preparation and training, the team began their expedition _______ earnest, determined to conquer the highest mountain of the area.","options":{"A":"of","B":"for","C":"at","D":"in"},"answer":"D","answerText":"in","uid":"T13-8","globalIndex":8},{"set":"13","source":"词汇测试13_复习1","id":9,"stem":"The China-made airplane C919 departed _______ Shanghai Hongqiao International Airport, marking a significant milestone for the country's aviation industry.","options":{"A":"away","B":"off","C":"from","D":"at"},"answer":"C","answerText":"from","uid":"T13-9","globalIndex":9},{"set":"13","source":"词汇测试13_复习1","id":10,"stem":"The detective went to the ball [in disguise] to observe the suspects without being recognized.","options":{"A":"hiding true identity","B":"making a face","C":"playing down","D":"putting on dancing shoes"},"answer":"A","answerText":"hiding true identity","uid":"T13-10","globalIndex":10},{"set":"13","source":"词汇测试13_复习1","id":11,"stem":"Despite the reported looming prospect, the CEO expresses the cautious _______ about the investment.","options":{"A":"optimism","B":"optimum","C":"optimist","D":"optician"},"answer":"A","answerText":"optimism","uid":"T13-11","globalIndex":11},{"set":"13","source":"词汇测试13_复习1","id":12,"stem":"The government has launched a crackdown ________ off-campus tutoring, aiming to relieve the burden to students.","options":{"A":"on","B":"over","C":"in","D":"about"},"answer":"A","answerText":"on","uid":"T13-12","globalIndex":12},{"set":"13","source":"词汇测试13_复习1","id":13,"stem":"Rescue attempts have been [hampered] by the bad weather and fears of another earthquake.","options":{"A":"persisted","B":"prevented","C":"persevered","D":"presented"},"answer":"B","answerText":"prevented","uid":"T13-13","globalIndex":13},{"set":"13","source":"词汇测试13_复习1","id":14,"stem":"The country experienced an economic [depression] in the 1930s, resulting in widespread unemployment, business failures, and financial hardships for its citizens.","options":{"A":"sadness","B":"pressure","C":"downturn","D":"frustration"},"answer":"C","answerText":"downturn","uid":"T13-14","globalIndex":14},{"set":"13","source":"词汇测试13_复习1","id":15,"stem":"Despite numerous challenges and dangers, the [courageous] firefighters bravely entered the burning building to rescue the trapped occupants.","options":{"A":"ruthless","B":"fearless","C":"considerate","D":"advantageous"},"answer":"B","answerText":"fearless","uid":"T13-15","globalIndex":15},{"set":"13","source":"词汇测试13_复习1","id":16,"stem":"The man wore a _______ expression on his face and showed no sympathy to his wife.","options":{"A":"passing","B":"passive","C":"passionate","D":"passable"},"answer":"B","answerText":"passive","uid":"T13-16","globalIndex":16},{"set":"13","source":"词汇测试13_复习1","id":17,"stem":"Compared with other industrial nations, the economic recession in Germany has been comparatively [mild] over the past 3 years.","options":{"A":"light","B":"limited","C":"temperate","D":"moderate"},"answer":"D","answerText":"moderate","uid":"T13-17","globalIndex":17},{"set":"13","source":"词汇测试13_复习1","id":18,"stem":"These refugees are in a miserable state, ________, homeless, half-starved, unloved and exhausted.","options":{"A":"ragged","B":"raged","C":"ranged","D":"ranked"},"answer":"A","answerText":"ragged","uid":"T13-18","globalIndex":18},{"set":"13","source":"词汇测试13_复习1","id":19,"stem":"Although it was tough, the negotiation about the border has been conducted ________ a positive manner.","options":{"A":"by","B":"to","C":"at","D":"in"},"answer":"D","answerText":"in","uid":"T13-19","globalIndex":19},{"set":"13","source":"词汇测试13_复习1","id":20,"stem":"In her current position, Ann broke through the [glass ceiling] as the first woman to reach senior management level in the company.","options":{"A":"social network","B":"peer isolation","C":"invisible barrier","D":"racial discrimination"},"answer":"C","answerText":"invisible barrier","uid":"T13-20","globalIndex":20},{"set":"13","source":"词汇测试13_复习1","id":21,"stem":"After a year's trial, David Johnson was finally convicted ______ murder and sentenced to life imprisonment.","options":{"A":"as","B":"over","C":"on","D":"of"},"answer":"D","answerText":"of","uid":"T13-21","globalIndex":21},{"set":"13","source":"词汇测试13_复习1","id":22,"stem":"The woman couldn’t get used to the [hustle and bustle] of city life, so she decided to return to her hometown.","options":{"A":"harmful environment","B":"stress and pressure","C":"fierce competition","D":"noise and quick pace"},"answer":"D","answerText":"noise and quick pace","uid":"T13-22","globalIndex":22},{"set":"13","source":"词汇测试13_复习1","id":23,"stem":"Over the past 5 decades, he had developed strong loyalty ________ the Stewart family, and therefore became a true member of the family.","options":{"A":"in","B":"at","C":"to","D":"for"},"answer":"C","answerText":"to","uid":"T13-23","globalIndex":23},{"set":"13","source":"词汇测试13_复习1","id":24,"stem":"The public is accusing this company of having prejudice ________ the female workforce.","options":{"A":"against","B":"over","C":"for","D":"to"},"answer":"A","answerText":"against","uid":"T13-24","globalIndex":24},{"set":"13","source":"词汇测试13_复习1","id":25,"stem":"Blue often conveys a sense of [tranquility] because maybe we subconsciously associate the color with blue skies and oceans.","options":{"A":"ambition","B":"calmness","C":"confidence","D":"expectation"},"answer":"B","answerText":"calmness","uid":"T13-25","globalIndex":25},{"set":"13","source":"词汇测试13_复习1","id":26,"stem":"Retirees in this company can receive a substantial payment in the _______ of stocks and bonuses.","options":{"A":"form","B":"formation","C":"formula","D":"format"},"answer":"A","answerText":"form","uid":"T13-26","globalIndex":26},{"set":"13","source":"词汇测试13_复习1","id":27,"stem":"The debater calmly and confidently ________ the opponent's claim with logical reasoning and supporting evidence.","options":{"A":"refused","B":"refuted","C":"rejected","D":"resisted"},"answer":"B","answerText":"refuted","uid":"T13-27","globalIndex":27},{"set":"13","source":"词汇测试13_复习1","id":28,"stem":"If you continue to make fun of others like that, you will _____ the good opinion of everyone.","options":{"A":"fling","B":"flush","C":"forge","D":"forfeit"},"answer":"D","answerText":"forfeit","uid":"T13-28","globalIndex":28},{"set":"13","source":"词汇测试13_复习1","id":29,"stem":"Shenzhen, a small seaside village in Guangdong Province, has [mushroomed] to a crowded city of over 10 million people in the past four decades.","options":{"A":"suddenly shrank","B":"quickly developed","C":"immediately converted","D":"completely assembled"},"answer":"B","answerText":"quickly developed","uid":"T13-29","globalIndex":29},{"set":"13","source":"词汇测试13_复习1","id":30,"stem":"These students have difficulty in accomplishing their goals, as they do not have the ______ motivation to push themselves.","options":{"A":"intricate","B":"introverted","C":"intrinsic","D":"introspective"},"answer":"C","answerText":"intrinsic","uid":"T13-30","globalIndex":30},{"set":"13","source":"词汇测试13_复习1","id":31,"stem":"It's difficult to be enrolled in that university, which means it will ________ all the students who fail to reach its requirements.","options":{"A":"include","B":"conclude","C":"exclude","D":"clue"},"answer":"C","answerText":"exclude","uid":"T13-31","globalIndex":31},{"set":"13","source":"词汇测试13_复习1","id":32,"stem":"The insurance policy provides comprehensive ______ for medical expenses, ensuring that the insured is protected in case of any unexpected health issues.","options":{"A":"average","B":"beverage","C":"storage","D":"coverage"},"answer":"D","answerText":"coverage","uid":"T13-32","globalIndex":32},{"set":"13","source":"词汇测试13_复习1","id":33,"stem":"For a long time, this mountain village has been underdeveloped due to the [barren] field in the region.","options":{"A":"fertile","B":"unproductive","C":"invaluable","D":"versatile"},"answer":"B","answerText":"unproductive","uid":"T13-33","globalIndex":33},{"set":"13","source":"词汇测试13_复习1","id":34,"stem":"Steve Jobs built his own computer company [from scratch] and became a multimillionaire before his thirtieth birthday.","options":{"A":"without any help","B":"making all his efforts","C":"using his own way","D":"with no prior basis"},"answer":"D","answerText":"with no prior basis","uid":"T13-34","globalIndex":34},{"set":"13","source":"词汇测试13_复习1","id":35,"stem":"As difficult as it looks, one may be surprised to find that there are a/an ______ of ways to tackle this issue.","options":{"A":"multitude","B":"altitude","C":"latitude","D":"attitude"},"answer":"A","answerText":"multitude","uid":"T13-35","globalIndex":35},{"set":"13","source":"词汇测试13_复习1","id":36,"stem":"There are only two powers in the world, the sword and the pen; and in the end the former is always conquered by the ________.","options":{"A":"late","B":"later","C":"latter","D":"latest"},"answer":"C","answerText":"latter","uid":"T13-36","globalIndex":36},{"set":"13","source":"词汇测试13_复习1","id":37,"stem":"The old man traveled by train for two days, just to apologize to his son in person, but his son was not interested in a reconciliation _______ his father.","options":{"A":"to","B":"with","C":"between","D":"on"},"answer":"B","answerText":"with","uid":"T13-37","globalIndex":37},{"set":"13","source":"词汇测试13_复习1","id":38,"stem":"The [famous] artist's latest masterpiece fascinated audience around the world.","options":{"A":"notorious","B":"renowned","C":"fashionable","D":"outdated"},"answer":"B","answerText":"renowned","uid":"T13-38","globalIndex":38},{"set":"13","source":"词汇测试13_复习1","id":39,"stem":"Whether there should be commercial _______________ of the natural resources in the country is still on hot discussion in the meeting.","options":{"A":"implementation","B":"limi   const STORE_KEY = 'vocab_practice_180_wrongbank_v1';
  let wrongBank = loadWrongBank();
  let currentList = [...QUESTIONS];
  let currentIndex = 0;
  let answered = false;
  let session = {done:0, correct:0, wrong:0};

  const $ = (id) => document.getElementById(id);

  function loadWrongBank(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function saveWrongBank(){ localStorage.setItem(STORE_KEY, JSON.stringify(wrongBank)); }
  function qTitle(q){ return `测试${q.set} · 原题${q.id}`; }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function filteredQuestions(){
    const set = $('setFilter').value;
    const kw = $('searchBox').value.trim().toLowerCase();
    let arr = QUESTIONS.filter(q => {
      if(set === '13' && q.set !== '13') return false;
      if(set === '14' && q.set !== '14') return false;
      if(set === 'wrong' && !wrongBank[q.uid]) return false;
      if(kw){
        const text = [q.id, q.uid, q.stem, q.options.A, q.options.B, q.options.C, q.options.D, q.answerText].join(' ').toLowerCase();
        if(!text.includes(kw)) return false;
      }
      return true;
    });
    return arr;
  }
  function refreshList(){
    currentList = filteredQuestions();
    if($('orderMode').value === 'random') shuffle(currentList);
    currentIndex = 0;
    render();
  }
  function shuffle(a){
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  }
  function render(){
    updateStats();
    renderMiniList();
    renderFullList();
    answered = false;
    const card = $('quizCard');
    if(!currentList.length){
      $('qTag').textContent='没有题目';
      $('progressTag').textContent='0 / 0';
      $('stem').textContent='当前筛选条件下没有题目。';
      $('options').innerHTML='';
      $('feedback').className='feedback info';
      $('feedback').textContent='可以切换题库范围，或清空搜索词。';
      return;
    }
    const q = currentList[currentIndex];
    $('qTag').textContent = qTitle(q);
    $('progressTag').textContent = `${currentIndex+1} / ${currentList.length}`;
    $('stem').innerHTML = escapeHtml(q.stem);
    $('feedback').className='feedback';
    $('feedback').textContent='';
    const letters = ['A','B','C','D'];
    $('options').innerHTML = letters.map(letter => `
      <label class="option" data-letter="${letter}">
        <input type="radio" name="choice" value="${letter}" />
        <span class="letter">${letter}.</span>
        <span>${escapeHtml(q.options[letter])}</span>
      </label>
    `).join('');
    document.querySelectorAll('.option').forEach(el=>{
      el.addEventListener('click',()=>{
        const r=el.querySelector('input'); r.checked=true;
      });
    });
  }
  function selected(){
    const r = document.querySelector('input[name="choice"]:checked');
    return r ? r.value : null;
  }
  function submitAnswer(){
    if(!currentList.length) return;
    const q = currentList[currentIndex];
    const sel = selected();
    if(!sel){ showFeedback('info','请先选择一个选项。'); return; }
    markOptions(q, sel);
    if(!answered){
      session.done++;
      if(sel === q.answer) session.correct++; else session.wrong++;
    }
    answered = true;
    if(sel === q.answer){
      showFeedback('ok',`回答正确：${q.answer}. ${q.answerText}`);
      if($('setFilter').value === 'wrong' && wrongBank[q.uid]){
        delete wrongBank[q.uid]; saveWrongBank();
        showFeedback('ok',`回答正确：${q.answer}. ${q.answerText}。已自动从错题库移除。`);
        currentList = filteredQuestions();
        if(currentIndex >= currentList.length) currentIndex = Math.max(0, currentList.length-1);
        setTimeout(render, 700);
      }
    }else{
      wrongBank[q.uid] = {time:Date.now(), count:(wrongBank[q.uid]?.count||0)+1}; saveWrongBank();
      showFeedback('bad',`回答错误。你选的是 ${sel}. ${q.options[sel]}；正确答案是 ${q.answer}. ${q.answerText}。本题已加入错题库。`);
      updateStats(); renderMiniList();
    }
  }
  function markOptions(q, sel){
    document.querySelectorAll('.option').forEach(el=>{
      const letter = el.dataset.letter;
      el.classList.remove('correct','wrong');
      if(letter === q.answer) el.classList.add('correct');
      if(letter === sel && sel !== q.answer) el.classList.add('wrong');
    });
  }
  function showAnswer(){
    if(!currentList.length) return;
    const q = currentList[currentIndex];
    markOptions(q, selected());
    showFeedback('info',`正确答案：${q.answer}. ${q.answerText}`);
  }
  function showFeedback(type,msg){
    $('feedback').className = 'feedback ' + type;
    $('feedback').textContent = msg;
  }
  function prev(){ if(!currentList.length) return; currentIndex=(currentIndex-1+currentList.length)%currentList.length; render(); }
  function next(){ if(!currentList.length) return; currentIndex=(currentIndex+1)%currentList.length; render(); }
  function randomOne(){ currentList = filteredQuestions(); if(!currentList.length){render();return;} currentIndex = Math.floor(Math.random()*currentList.length); render(); }
  function addWrong(){ if(!currentList.length) return; const q=currentList[currentIndex]; wrongBank[q.uid]={time:Date.now(), count:(wrongBank[q.uid]?.count||0)+1}; saveWrongBank(); updateStats(); renderMiniList(); showFeedback('info','已加入错题库。'); }
  function removeWrong(){ if(!currentList.length) return; const q=currentList[currentIndex]; delete wrongBank[q.uid]; saveWrongBank(); updateStats(); renderMiniList(); showFeedback('info','已移出错题库。'); if($('setFilter').value==='wrong') { currentList=filteredQuestions(); if(currentIndex>=currentList.length) currentIndex=Math.max(0,currentList.length-1); setTimeout(render,300); } }
  function updateStats(){
    const total = QUESTIONS.length;
    const wrongCount = Object.keys(wrongBank).length;
    const set = $('setFilter')?.value || 'all';
    const rangeCount = currentList.length;
    const acc = session.done ? Math.round(session.correct / session.done * 100) : 0;
    $('stats').innerHTML = `
      <span class="pill">总题数：${total}</span>
      <span class="pill">当前范围：${rangeCount}</span>
      <span class="pill">错题库：${wrongCount}</span>
      <span class="pill">本次已答：${session.done}</span>
      <span class="pill">正确：${session.correct}</span>
      <span class="pill">错误：${session.wrong}</span>
      <span class="pill">正确率：${acc}%</span>
    `;
  }
  function renderMiniList(){
    const html = currentList.map((q,i)=>{
      const active = i===currentIndex ? ' active' : '';
      const badge = wrongBank[q.uid] ? '<span class="wrong-badge">错</span>' : '';
      return `<div class="mini-item${active}" data-i="${i}">${qTitle(q)} ${badge}<br><span class="note">${escapeHtml(q.stem.slice(0,70))}${q.stem.length>70?'...':''}</span></div>`;
    }).join('') || '<div class="mini-item">暂无题目</div>';
    $('miniList').innerHTML=html;
    document.querySelectorAll('.mini-item[data-i]').forEach(el=>{
      el.addEventListener('click',()=>{currentIndex=Number(el.dataset.i);render();});
    });
  }
  function renderFullList(){
    if(!$('fullListPanel').classList.contains('show')) return;
    $('fullList').innerHTML = currentList.map((q,i)=>{
      const opts = ['A','B','C','D'].map(l=>`<div>${l}. ${escapeHtml(q.options[l])}</div>`).join('');
      return `<details><summary>${i+1}. ${qTitle(q)} ${wrongBank[q.uid]?'<span class="wrong-badge">错</span>':''}</summary><div class="detail-body"><div>${escapeHtml(q.stem)}</div><div style="margin-top:8px">${opts}</div><div style="margin-top:8px">答案：<span class="ans">${q.answer}. ${escapeHtml(q.answerText)}</span></div></div></details>`;
    }).join('');
  }
  function exportWrong(){
    const data = JSON.stringify(wrongBank, null, 2);
    navigator.clipboard?.writeText(data).then(()=>alert('错题库已复制到剪贴板。')).catch(()=>prompt('复制下面内容保存：', data));
  }
  function importWrong(){
    const data = prompt('粘贴之前导出的错题库 JSON：');
    if(!data) return;
    try{ wrongBank = JSON.parse(data); saveWrongBank(); refreshList(); alert('导入成功。'); }
    catch(e){ alert('导入失败：JSON格式不正确。'); }
  }
  function clearWrong(){
    if(confirm('确定清空错题库吗？')){ wrongBank={}; saveWrongBank(); refreshList(); }
  }

  $('startBtn').addEventListener('click', refreshList);
  $('randomBtn').addEventListener('click', randomOne);
  $('prevBtn').addEventListener('click', prev);
  $('nextBtn').addEventListener('click', next);
  $('submitBtn').addEventListener('click', submitAnswer);
  $('showBtn').addEventListener('click', showAnswer);
  $('addWrongBtn').addEventListener('click', addWrong);
  $('removeWrongBtn').addEventListener('click', removeWrong);
  $('resetStatsBtn').addEventListener('click', ()=>{session={done:0,correct:0,wrong:0}; updateStats();});
  $('setFilter').addEventListener('change', refreshList);
  $('orderMode').addEventListener('change', refreshList);
  $('searchBox').addEventListener('input', ()=>{ clearTimeout(window.__kwt); window.__kwt=setTimeout(refreshList,200); });
  $('toggleListBtn').addEventListener('click', ()=>{
    $('fullListPanel').classList.toggle('show');
    $('toggleListBtn').textContent = $('fullListPanel').classList.contains('show') ? '收起全部题' : '展开全部题';
    renderFullList();
  });
  $('exportWrongBtn').addEventListener('click', exportWrong);
  $('importWrongBtn').addEventListener('click', importWrong);
  $('clearWrongBtn').addEventListener('click', clearWrong);

  document.addEventListener('keydown', (e)=>{
    const tag = document.activeElement?.tagName?.toLowerCase();
    if(tag === 'input' && document.activeElement.id === 'searchBox') return;
    const k=e.key.toLowerCase();
    if(['a','b','c','d'].includes(k)){
      const r=document.querySelector(`input[name="choice"][value="${k.toUpperCase()}"]`);
      if(r){ r.checked=true; }
    }else if(e.key==='Enter') submitAnswer();
    else if(e.key==='ArrowLeft') prev();
    else if(e.key==='ArrowRight') next();
  });

  refreshList();
  </script>
</body>
</html>
